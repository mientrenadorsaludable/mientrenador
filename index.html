<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / App Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <title>Mi entrenador Fuerte y saludable | App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --bg-main: #020617;
            --accent: #f97316;
            --neon-cyan: #22d3ee;
            --neon-green: #4ade80;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; background-color: var(--bg-main); }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.02); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        :fullscreen { background-color: #020617; }
        :-webkit-full-screen { background-color: #020617; }

        .neon-text-orange { text-shadow: 0 0 40px rgba(249, 115, 22, 0.9); }
        .neon-text-cyan { text-shadow: 0 0 40px rgba(34, 211, 238, 0.7); }
        .neon-text-green { text-shadow: 0 0 40px rgba(74, 222, 128, 0.9); }
        
        .pie-background { fill: rgba(255, 255, 255, 0.03); }

        .btn-control {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-control:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mientrenador-v3"; 
        const APP_TITLE = "Mi entrenador Fuerte y saludable";
        const APP_VERSION = "18.4.0"; 

        const WARMUP_STEPS = [
            'tobillo derecho', 'tobillo izquierdo', 
            'rodilla derecha', 'rodilla izquierda', 
            'cintura', 
            'brazo derecho', 'brazo izquierdo', 
            'cabeza'
        ];

        const DEFAULT_PARAMS = {
            calentamiento: { action: 30, change: 5, rounds: 8, cycles: 1, rest: 0 },
            entrenamiento: { action: 30, change: 10, rounds: 9, cycles: 4, rest: 60 },
            estiramientos: { action: 30, change: 5, rounds: 17, cycles: 1, rest: 0 }
        };

        const formatTime = (s) => `${Math.floor(s / 60)}:${((s || 0) % 60).toString().padStart(2, '0')}`;

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('workouts'); 
            const [workouts, setWorkouts] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [editingWorkout, setEditingWorkout] = useState(null);

            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'es-ES';
                msg.rate = 1.15;
                window.speechSynthesis.speak(msg);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    setTimeout(() => setLoading(false), 2000);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                const unsubW = pathBase.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = pathBase.collection('history').onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubW(); unsubH(); };
            }, [user]);

            const startWorkout = async (w) => {
                setSelectedWorkout(w);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    // SE ELIMINA EL BLOQUEO DE ORIENTACIÓN LANDSCAPE PARA PERMITIR VERTICAL
                } catch (err) {}
                setView('play');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white text-center">
                    <div className="animate-pulse-slow text-9xl mb-6 text-center mx-auto text-white">🏋️‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase tracking-tighter mb-4 leading-tight">{APP_TITLE}</h1>
                    <div className="mt-4 flex flex-col items-center gap-3">
                        <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                        <span className="text-slate-600 font-black text-[10px] tracking-[0.5em] uppercase italic">VERSIÓN {APP_VERSION}</span>
                    </div>
                </div>
            );

            if (!user) return <AuthView appId={appId} db={db} auth={auth} />;

            return (
                <div className="h-full w-full flex flex-col relative bg-slate-950 overflow-hidden text-center">
                    {view !== 'play' && (
                        <header className="p-6 flex justify-between items-center bg-slate-900 shrink-0 border-b border-white/5 text-white">
                            <div onClick={() => setView('workouts')} className="cursor-pointer text-white text-left text-center">
                                <h1 className="text-lg font-black italic uppercase leading-none tracking-tight">{APP_TITLE}</h1>
                                <p className="text-[9px] font-bold text-slate-500 lowercase italic tracking-wider mt-1">{user.email}</p>
                            </div>
                            <button onClick={() => auth.signOut()} className="p-2 bg-red-500/10 rounded-xl text-red-500 font-bold border border-red-500/20 text-lg flex items-center justify-center text-center text-white">🚪</button>
                        </header>
                    )}

                    <main className={`flex-1 overflow-y-auto scrollbar-hide w-full ${view === 'play' ? 'p-0 h-full' : 'p-4 max-w-2xl mx-auto'}`}>
                        {view === 'workouts' && <WorkoutsView workouts={workouts} setWorkout={startWorkout} appId={appId} db={db} user={user} onEdit={(w) => { setEditingWorkout(w); setView('create'); }} onCreate={() => { setEditingWorkout(null); setView('create'); }} />}
                        {view === 'avance' && <AvanceView history={history} />}
                        {view === 'history' && <HistoryListView history={history} user={user} appId={appId} db={db} />}
                        {view === 'create' && <CreateView onCancel={() => { setView('workouts'); setEditingWorkout(null); }} user={user} appId={appId} db={db} workoutToEdit={editingWorkout} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} speak={speak} onExit={() => {
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts');
                        }} onComplete={(name, time) => {
                            db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() });
                            setView('workouts');
                        }} />}
                        {view === 'admin' && <AdminView onBack={() => setView('workouts')} appId={appId} db={db} />}
                    </main>

                    {view !== 'play' && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/5 p-4 flex justify-around items-center z-50 shadow-2xl">
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[9px] font-black ${view === 'workouts' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center leading-none">🏋️</span> MIS RUTINAS
                            </button>
                            <button onClick={() => setView('avance')} className={`flex flex-col items-center text-[9px] font-black ${view === 'avance' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center leading-none">📊</span> AVANCE
                            </button>
                            <button onClick={() => setView('history')} className={`flex flex-col items-center text-[9px] font-black ${view === 'history' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center leading-none">📜</span> HISTORIAL
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        function AuthView({ appId, db, auth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email.trim(), password);
                    else await auth.signInWithEmailAndPassword(email.trim(), password);
                } catch (err) { alert("Error: " + err.message); }
            };
            return (
                <div className="h-full w-full flex flex-col items-center bg-slate-950 p-10 pt-20 text-white text-center">
                    <div className="text-7xl mb-6 animate-pulse-slow mx-auto text-center text-white">🏃‍♂️</div>
                    <h1 className="text-3xl font-black italic uppercase mb-1 tracking-tighter text-white italic text-center">{APP_TITLE}</h1>
                    <form onSubmit={handleAuth} className="space-y-4 w-full max-w-sm mt-8 text-center text-white">
                        <input type="email" placeholder="EMAIL" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-center text-white text-center text-center text-center" value={email} onChange={e => setEmail(e.target.value)} required />
                        <input type="password" placeholder="CLAVE" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-center text-white text-center text-center text-center" value={password} onChange={e => setPassword(e.target.value)} required />
                        <button type="submit" className="w-full bg-orange-500 py-6 rounded-full font-black uppercase shadow-xl italic text-white text-center text-white text-center">
                            {isRegister ? 'REGISTRARME' : 'ENTRAR'}
                        </button>
                    </form>
                    <button onClick={() => setIsRegister(!isRegister)} className="mt-8 text-slate-500 text-[10px] font-black uppercase border-b border-orange-500/30 pb-1 italic text-center text-white">
                        {isRegister ? 'Ya tengo cuenta' : 'Crear cuenta nueva'}
                    </button>
                </div>
            );
        }

        function WorkoutsView({ workouts, setWorkout, appId, db, user, onEdit, onCreate }) {
            return (
                <div className="space-y-4 pb-32 animate-fade-in text-white text-center">
                    {workouts.map(w => (
                        <div key={w.id} className="glass-card p-6 flex justify-between items-center text-left text-white shadow-xl">
                            <div className="flex-1 cursor-pointer truncate text-left text-white" onClick={() => setWorkout(w)}>
                                <h3 className="font-black italic uppercase text-md mb-2 truncate text-white">{w.name}</h3>
                                <span className="text-[10px] font-black text-orange-500 uppercase tracking-widest italic leading-none">PLAN ACTIVO</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setWorkout(w)} className="bg-white text-black px-5 py-3 rounded-2xl font-black text-[10px] italic text-center text-black active:scale-90 transition-transform">GO</button>
                                <button onClick={() => onEdit(w)} className="bg-slate-800 text-white p-3 rounded-2xl flex items-center justify-center text-xs active:scale-90">📝</button>
                                <button onClick={() => db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts').doc(w.id).delete()} className="bg-red-500/10 text-red-500 p-3 rounded-2xl flex items-center justify-center text-xs active:scale-90">🗑️</button>
                            </div>
                        </div>
                    ))}
                    <button onClick={onCreate} className="w-full bg-white/5 border border-white/10 py-5 rounded-full font-black uppercase shadow-xl italic tracking-widest active:scale-95 transition-transform flex items-center justify-center gap-2 mt-4 text-white text-center">
                        <span className="text-xl leading-none">➕</span> NUEVA RUTINA
                    </button>
                </div>
            );
        }

        function PlayerView({ workout, speak, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const savedRef = useRef(false);
            const wakeLockRef = useRef(null);

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { wakeLockRef.current = await navigator.wakeLock.request('screen'); } catch (err) {}
                }
            };

            const releaseWakeLock = async () => {
                if (wakeLockRef.current !== null) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                }
            };

            const handleRestart = () => {
                setStatus('paused');
                setIdx(0);
                if (steps.length > 0) setTimeLeft(steps[0].seconds);
                setElapsed(0);
                savedRef.current = false;
                speak("Rutina reiniciada");
            };

            const handleStopManually = () => {
                setStatus('finished');
                releaseWakeLock();
                if (!savedRef.current) { 
                    onComplete(workout.name, elapsed); 
                    savedRef.current = true; 
                    speak(`Felicidades, entrenaste ${formatTime(elapsed)}`);
                }
            };

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                const REGIONS = ['Piernas', 'Brazos', 'Tronco'];

                s.push({ label: 'PREPARACIÓN', seconds: 30, color: 'bg-slate-800', voice: 'Prepárate', phase: 'Iniciando', r: 1, tr: 1, cy: 1, tc: 1 });

                ['calentamiento', 'entrenamiento', 'estiramientos'].forEach((pId) => {
                    const c = ph[pId];
                    for(let cy = 1; cy <= c.cycles; cy++) {
                        for(let r = 1; r <= c.rounds; r++) {
                            let msg = 'Entrena';
                            let label = pId.toUpperCase();
                            if (pId === 'entrenamiento') {
                                const reg = REGIONS[Math.floor((r-1)/3) % 3];
                                label = reg.toUpperCase();
                                msg = (r-1)%3 === 0 ? `Ejercita ${reg}` : 'Sigue';
                            } else if (pId === 'calentamiento') {
                                const part = WARMUP_STEPS[(r-1) % WARMUP_STEPS.length];
                                label = part.toUpperCase();
                                msg = "Calienta " + part;
                            }
                            s.push({ label, seconds: c.action, color: 'bg-emerald-600', voice: msg, phase: pId.toUpperCase(), r, tr: c.rounds, cy, tc: c.cycles });
                            if(r < c.rounds) s.push({ label: 'CAMBIO', seconds: c.change, color: 'bg-yellow-500', voice: 'Cambio', phase: pId.toUpperCase(), r, tr: c.rounds, cy, tc: c.cycles });
                        }
                        if(cy < c.cycles && c.rest > 0) s.push({ label: 'DESCANSO', seconds: c.rest, color: 'bg-red-600', voice: 'Descanso largo', phase: pId.toUpperCase(), r: 'R', tr: c.rounds, cy, tc: c.cycles });
                    }
                });
                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].seconds);
                
                return () => releaseWakeLock();
            }, [workout]);

            useEffect(() => {
                if (status !== 'running') { releaseWakeLock(); return; }
                requestWakeLock();
                const current = steps[idx];
                if (timeLeft === current?.seconds) speak(current.voice);
                if (timeLeft <= 3 && timeLeft > 0) speak(timeLeft.toString());
            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); setTimeLeft(steps[idx+1].seconds); 
                                if('vibrate' in navigator) navigator.vibrate(200); 
                            } else {
                                setStatus('finished');
                                releaseWakeLock();
                                if (!savedRef.current) { 
                                    onComplete(workout.name, elapsed + 1); 
                                    savedRef.current = true; 
                                    speak(`Felicidades, entrenaste ${formatTime(elapsed + 1)}`);
                                }
                            }
                        }
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps, workout.name, elapsed, onComplete]);

            if (status === 'finished') return (
                <div className="h-screen flex flex-col items-center justify-center p-8 bg-slate-950 text-white italic text-center text-center">
                    <div className="text-9xl mb-10 animate-bounce text-white">🏆</div>
                    <h1 className="text-6xl font-black mb-4 uppercase tracking-tighter text-white text-center leading-none">¡LOGRADO!</h1>
                    <div className="glass-card p-10 w-full mb-12 shadow-2xl border-orange-500/20 text-center text-white text-center">
                        <p className="text-[10px] font-black opacity-40 uppercase text-center text-white">Total Entrenamiento</p>
                        <p className="text-7xl font-black text-orange-500 leading-none text-center text-white">{formatTime(elapsed)}</p>
                    </div>
                    <div className="flex flex-col gap-4 w-full max-w-sm">
                        <button onClick={handleRestart} className="w-full bg-orange-500 text-white py-5 rounded-full font-black uppercase shadow-xl italic tracking-widest text-center text-white active:scale-95 transition-transform">VOLVER A EMPEZAR</button>
                        <button onClick={onExit} className="w-full bg-white text-black py-5 rounded-full font-black uppercase shadow-2xl active:scale-95 transition-transform italic tracking-widest text-center text-black">FINALIZAR</button>
                    </div>
                </div>
            );

            const curr = steps[idx];
            const pieCirc = 2 * Math.PI * 20;
            const timerPercentage = curr?.seconds ? (Math.min(1, (curr.seconds - timeLeft) / curr.seconds)) : 0;
            const totalS = steps.reduce((a,b) => a + b.seconds, 0);
            const sessionPercentage = totalS ? (elapsed / totalS) : 0;

            return (
                <div className={`h-screen -m-4 flex flex-col transition-colors duration-1000 ${curr?.color || 'bg-slate-950'} text-white overflow-hidden text-center text-center`}>
                    <div className="flex justify-between items-start p-6 pt-10 z-30 relative shrink-0 h-[15vh] text-center">
                        <button onClick={onExit} className="bg-black/20 px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-white/5 active:scale-90 italic text-center text-white">✖ SALIR</button>
                        <div className="text-center flex-1 mx-2 text-center text-white">
                            <p className="text-[8px] font-black uppercase opacity-60 tracking-[0.2em] mb-1 italic leading-none text-center text-white">{curr?.phase}</p>
                            <div className="flex items-center justify-center gap-2 text-center text-white">
                                <span className="font-black uppercase italic text-xs truncate max-w-[100px] text-white">{workout.name}</span>
                                <div className="bg-white/20 px-2 py-0.5 rounded-full text-[8px] font-black backdrop-blur-md flex items-center gap-1 text-center text-white">⏱️ {formatTime(elapsed)}</div>
                            </div>
                        </div>
                        <div className="bg-black/20 p-3 rounded-2xl opacity-40 leading-none text-white text-xl">🔊</div>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center relative overflow-hidden px-4">
                        <div className="w-full text-center mb-4 text-white text-center">
                            <h2 className="text-[6vh] font-black uppercase italic drop-shadow-2xl text-white text-center">{curr?.label || curr?.phase}</h2>
                        </div>
                        
                        <div className="relative flex items-center justify-center w-[50vh] h-[50vh] mx-auto text-white text-center">
                            <svg className="absolute w-full h-full transform -rotate-90 text-center" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                <circle cx="50" cy="50" r="20" stroke="var(--accent)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: pieCirc - (timerPercentage * pieCirc), transition: 'stroke-dashoffset 1s linear' }} />
                            </svg>
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-white text-center">
                                <span className="text-[20vh] font-black tabular-nums drop-shadow-2xl leading-none neon-text-orange italic text-white text-center">{timeLeft}</span>
                            </div>
                        </div>
                        
                        <div className="mt-6 flex gap-4 w-full max-w-[300px] px-2 italic text-center text-white text-center">
                            <div className="flex-1 bg-black/30 p-4 rounded-[1.5rem] flex flex-col items-center backdrop-blur-md text-white"><span className="text-[8px] font-black uppercase opacity-40 mb-1 italic leading-none text-white">Rondas</span><span className="text-2xl font-black text-white">{curr?.r || 1}/{curr?.tr || 1}</span></div>
                            <div className="flex-1 bg-black/30 p-4 rounded-[1.5rem] flex flex-col items-center backdrop-blur-md text-white"><span className="text-[8px] font-black uppercase opacity-40 mb-1 italic leading-none text-white">Ciclos</span><span className="text-2xl font-black text-white">{curr?.cy || 1}</span></div>
                        </div>
                    </div>
                    <div className="p-8 pb-16 flex justify-center items-center gap-4 z-30 text-white text-center">
                        <button onClick={handleRestart} title="Reiniciar" className="bg-white/20 w-10 h-10 rounded-full flex items-center justify-center border border-white/10 active:scale-90 transition-transform text-white text-lg shadow-lg">🔄</button>
                        <button onClick={handleStopManually} title="Parar y Guardar" className="bg-red-500/20 w-10 h-10 rounded-full flex items-center justify-center border border-red-500/30 active:scale-90 transition-transform text-red-500 text-lg shadow-lg text-center">⏹</button>
                        <button onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} className="bg-white text-black w-18 h-18 rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-all text-3xl text-black text-center">
                            {status === 'running' ? '⏸' : '▶'}
                        </button>
                        <button onClick={() => setTimeLeft(0)} title="Siguiente" className="bg-white/20 w-10 h-10 rounded-full flex items-center justify-center border border-white/10 active:scale-90 transition-transform text-white text-lg shadow-lg">⏭</button>
                    </div>
                </div>
            );
        }

        function HistoryListView({ history, user, appId, db }) {
            return (
                <div className="space-y-4 animate-fade-in pb-20 text-center mx-auto w-full text-white italic text-center text-center">
                    <h2 className="text-[10px] font-black uppercase text-slate-500 mb-2 italic tracking-widest leading-none text-center text-white text-center">HISTORIAL</h2>
                    {history.sort((a,b) => new Date(b.date) - new Date(a.date)).map(h => (
                        <div key={h.id} className="glass-card p-5 flex justify-between items-center border-white/5 text-center text-white text-center shadow-md">
                            <div className="flex-1 text-left text-white text-left text-center">
                                <h3 className="font-black uppercase italic text-xs mb-1 truncate text-white text-center">{h.workoutName}</h3>
                                <p className="text-[8px] font-bold text-slate-500 uppercase leading-none text-white text-left text-center">{new Date(h.date).toLocaleDateString()} • {formatTime(h.totalTime)}</p>
                            </div>
                            <button onClick={() => db.collection(`artifacts`).doc(appId).collection('users').doc(user.uid).collection('history').doc(h.id).delete()} className="text-slate-700 p-2 text-white text-center hover:text-red-500 transition-colors text-center">✕</button>
                        </div>
                    ))}
                    {history.length === 0 && <p className="p-20 opacity-20 text-[10px] font-black italic uppercase text-white text-center">Sin historial aún</p>}
                </div>
            );
        }

        function CreateView({ onCancel, user, appId, db, workoutToEdit }) {
            const [name, setName] = useState(workoutToEdit ? workoutToEdit.name : '');
            const [phases, setPhases] = useState(workoutToEdit ? workoutToEdit.phases : DEFAULT_PARAMS);
            const update = (p, f, v) => setPhases(prev => ({...prev, [p]: {...prev[p], [f]: parseInt(v) || 0}}));
            const save = async () => {
                if (!name.trim()) return;
                const path = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts');
                const data = { name, phases, updatedAt: new Date().toISOString() };
                
                // MEJORA: SI EXISTE workoutToEdit, ACTUALIZA. SI NO, CREA.
                if (workoutToEdit && workoutToEdit.id) {
                    await path.doc(workoutToEdit.id).update(data);
                } else {
                    await path.add({ ...data, createdAt: new Date().toISOString() });
                }
                onCancel();
            };
            return (
                <div className="flex-1 flex flex-col pb-32 animate-in text-white italic text-center text-white text-center">
                    <header className="flex items-center gap-4 py-6 text-center text-white text-center">
                        <button onClick={onCancel} className="p-3 bg-slate-900 rounded-2xl text-center text-white active:scale-90 shadow-lg text-center">⬅</button>
                        <h2 className="text-xl font-black uppercase italic flex-1 text-center text-white text-center">{workoutToEdit ? 'EDITAR' : 'NUEVA'} RUTINA</h2>
                    </header>
                    <div className="space-y-6 text-center text-white text-center px-1 text-center">
                        <input type="text" placeholder="NOMBRE DEL PLAN" className="w-full p-6 bg-slate-900 border border-white/10 rounded-[2rem] font-black text-center uppercase italic focus:border-orange-500 outline-none text-white text-center text-white text-center shadow-inner text-center" value={name} onChange={e => setName(e.target.value)} />
                        {['calentamiento', 'entrenamiento', 'estiramientos'].map((p) => (
                            <div key={p} className="glass-card p-6 italic mb-4 text-center text-white text-center text-white shadow-xl text-center">
                                <span className="font-black uppercase text-xs tracking-widest text-orange-500 border-b border-white/5 block mb-6 pb-2 mx-auto w-fit uppercase text-center text-white text-center text-center text-center">{p}</span>
                                <div className="grid grid-cols-2 gap-4 text-center text-white text-center text-white text-center">
                                    <InputField label="ACCIÓN (S)" val={phases[p].action} set={v => update(p, 'action', v)} />
                                    <InputField label="CAMBIO (S)" val={phases[p].change} set={v => update(p, 'change', v)} />
                                    <InputField label="RONDAS" val={phases[p].rounds} set={v => update(p, 'rounds', v)} />
                                    <InputField label="CICLOS" val={phases[p].cycles} set={v => update(p, 'cycles', v)} />
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-slate-950/95 backdrop-blur-xl border-t border-white/5 z-50 text-center text-white text-center">
                        <button onClick={save} className="w-full max-w-sm mx-auto bg-white text-black py-6 rounded-full font-black uppercase shadow-2xl italic tracking-widest text-center text-black active:scale-95 transition-transform text-center">GUARDAR RUTINA</button>
                    </div>
                </div>
            );
        }

        function InputField({ label, val, set }) {
            return (
                <div className="flex flex-col items-center text-center text-white text-center text-center">
                    <span className="text-[8px] font-bold uppercase opacity-40 mb-1 tracking-widest leading-none text-center text-white text-center">{label}</span>
                    <input type="number" className="w-full bg-slate-800/40 border border-white/5 p-4 rounded-xl text-center font-black text-lg outline-none text-white text-center text-white text-center shadow-inner text-center" value={val} onChange={e => set(e.target.value)} />
                </div>
            );
        }

        function AvanceView({ history }) {
            return (
                <div className="space-y-6 pb-24 animate-fade-in text-white text-center text-white text-center">
                    <h2 className="text-[10px] font-black uppercase text-slate-500 italic tracking-widest text-center text-white text-center text-center">ESTADÍSTICAS</h2>
                    <div className="glass-card p-10 flex flex-col items-center text-center text-white text-center shadow-2xl text-center">
                        <p className="text-[10px] font-black uppercase opacity-40 mb-2 text-center text-white text-center text-center">SESIONES REALIZADAS</p>
                        <p className="text-7xl font-black text-orange-500 text-center text-white text-center neon-text-orange text-center">{history.length}</p>
                    </div>
                </div>
            );
        }

        function AdminView({ onBack, appId, db }) {
            const [users, setUsers] = useState([]);
            useEffect(() => {
                const unsub = db.collection(`artifacts`).doc(appId).collection('public').doc('data').collection('users_metadata').onSnapshot(s => setUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);
            return (
                <div className="animate-fade-in space-y-4 pb-20 p-4 text-center mx-auto w-full max-w-sm flex flex-col items-center text-white italic text-center text-center">
                    <button onClick={onBack} className="p-4 bg-slate-900 rounded-2xl font-black text-xs tracking-widest border border-white/5 mb-6 uppercase text-white text-center text-center text-center">VOLVER AL INICIO</button>
                    <div className="grid gap-3 text-center mx-auto w-full text-center text-center">
                        {users.map(u => (
                            <div key={u.id} className="glass-card p-6 flex justify-between items-center shadow-sm text-center text-white text-center">
                                <div className="truncate text-left pr-4 text-white text-center text-white text-center">
                                    <h4 className="font-bold text-[11px] text-white/90 truncate leading-none mb-1 text-center text-center">{u.email}</h4>
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1 italic text-center text-center">PASS: {u.password}</p>
                                </div>
                                <button onClick={async () => { if(confirm("¿Borrar?")) await db.collection(`artifacts`).doc(appId).collection('public').doc('data').collection('users_metadata').doc(u.id).delete(); }} className="bg-red-500/20 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black border border-red-500/30 uppercase italic text-center hover:bg-red-500 hover:text-white transition-colors text-center text-white text-center">Borrar</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
