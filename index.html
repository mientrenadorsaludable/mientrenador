<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Modo App Nativa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <title>Mi Entrenador | Fuerte y saludable</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --bg-main: #020617;
            --accent: #f97316;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; background-color: var(--bg-main); }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }

        /* Anillo de progreso centralizado y fluido */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.02); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        :fullscreen { background-color: #020617; }
        :-webkit-full-screen { background-color: #020617; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mientrenador-v3";
        const SUPERUSER_EMAIL = "cumorahnet@gmail.com";
        
        // VERSIÓN PROGRESIVA DE LA APP
        const APP_VERSION = "4.0.0"; 

        const speak = (text) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'es-ES';
            msg.rate = 1.2;
            window.speechSynthesis.speak(msg);
        };

        const formatTime = (s) => `${Math.floor(s / 60)}:${((s || 0) % 60).toString().padStart(2, '0')}`;

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [workouts, setWorkouts] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [editingWorkout, setEditingWorkout] = useState(null);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    // Splash Screen fijo de 3 segundos
                    setTimeout(() => setLoading(false), 3000);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                const unsubW = pathBase.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = pathBase.collection('history').onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubW(); unsubH(); };
            }, [user]);

            const startWorkout = async (w) => {
                setSelectedWorkout(w);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                    
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch (err) {}
                setView('play');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white overflow-hidden">
                    <div className="relative z-10 flex flex-col items-center animate-fade-in text-center px-6">
                        <div className="text-9xl mb-6 drop-shadow-[0_0_40px_rgba(249,115,22,0.4)] animate-pulse-slow">🏋️‍♂️</div>
                        <h1 className="text-5xl font-black italic uppercase tracking-tighter mb-1 leading-none">MI ENTRENADOR</h1>
                        <p className="text-orange-500 font-bold uppercase text-sm tracking-[0.3em] italic mb-12 opacity-80">Fuerte y saludable</p>
                        
                        {/* Indicador de Versión en Splash */}
                        <div className="mt-4 flex flex-col items-center gap-3">
                            <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                            <span className="text-slate-600 font-black text-[10px] tracking-[0.5em] uppercase italic">Versión {APP_VERSION}</span>
                        </div>
                    </div>
                </div>
            );

            if (!user) return <AuthView appId={appId} db={db} auth={auth} />;

            return (
                <div className="h-full w-full flex flex-col relative bg-slate-950 overflow-hidden">
                    {view !== 'play' && (
                        <header className="p-6 flex justify-between items-center bg-slate-900 shadow-2xl shrink-0 border-b border-white/5">
                            <div>
                                <h1 className="text-xl font-black italic uppercase leading-none tracking-tight">Mi Entrenador</h1>
                                <p className="text-[9px] font-bold text-slate-500 lowercase italic tracking-wider">{user.email}</p>
                            </div>
                            <div className="flex gap-2">
                                {user.email?.toLowerCase() === SUPERUSER_EMAIL.toLowerCase() && (
                                    <button onClick={() => setView('admin')} className="p-2 bg-slate-800 rounded-xl font-bold">🛡️</button>
                                )}
                                <button onClick={() => auth.signOut()} className="p-2 bg-red-500/10 rounded-xl text-red-500 font-bold border border-red-500/20">🚪</button>
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 overflow-y-auto scrollbar-hide w-full ${view === 'play' ? 'p-0 h-full' : 'p-4 max-w-2xl mx-auto'}`}>
                        {view === 'dashboard' && <DashboardView history={history} workouts={workouts} onStart={startWorkout} />}
                        {view === 'workouts' && <WorkoutsView workouts={workouts} setWorkout={startWorkout} onEdit={(w) => { setEditingWorkout(w); setView('create'); }} onCreate={() => { setEditingWorkout(null); setView('create'); }} user={user} appId={appId} db={db} />}
                        {view === 'history' && <HistoryListView history={history} user={user} appId={appId} db={db} />}
                        {view === 'create' && <CreateView onCancel={() => { setView('workouts'); setEditingWorkout(null); }} user={user} appId={appId} db={db} workoutToEdit={editingWorkout} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} onExit={() => {
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts');
                        }} onComplete={(name, time) => {
                            db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() });
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('dashboard');
                        }} />}
                        {view === 'admin' && <AdminView onBack={() => setView('dashboard')} appId={appId} db={db} />}
                    </main>

                    {view !== 'play' && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/5 p-4 flex justify-around items-center z-50 shadow-2xl">
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center text-[9px] font-black ${view === 'dashboard' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1">📊</span> DASHBOARD
                            </button>
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[9px] font-black ${view === 'workouts' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1">🏋️</span> RUTINAS
                            </button>
                            <button onClick={() => setView('history')} className={`flex flex-col items-center text-[9px] font-black ${view === 'history' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1">📜</span> HISTORIAL
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        function AuthView({ appId, db, auth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [isRegister, setIsRegister] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    let res;
                    if (isRegister) res = await auth.createUserWithEmailAndPassword(email.trim(), password);
                    else res = await auth.signInWithEmailAndPassword(email.trim(), password);
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').doc(res.user.uid).set({
                        email: email.trim(), password, lastActivity: new Date().toISOString()
                    }, { merge: true });
                } catch (err) { console.log(err); }
            };

            return (
                <div className="h-full w-full flex flex-col justify-center p-10 text-center animate-fade-in bg-slate-950 overflow-y-auto">
                    <div className="text-7xl mb-4 animate-pulse-slow">🏃‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase leading-none mb-1">MI ENTRENADOR</h1>
                    <p className="text-orange-500 font-bold uppercase text-[9px] tracking-[0.3em] mb-12 italic text-center">Fuerte y Saludable</p>
                    <form onSubmit={handleAuth} className="space-y-4 max-w-sm mx-auto w-full">
                        <input type="email" placeholder="EMAIL" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-xs lowercase" value={email} onChange={e => setEmail(e.target.value)} required />
                        <div className="relative">
                            <input type={showPass ? "text" : "password"} placeholder="PASSWORD" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-xs" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-6 top-6 text-xl">{showPass ? '🙈' : '👁️'}</button>
                        </div>
                        <button type="submit" className="w-full bg-orange-500 py-6 rounded-full font-black uppercase shadow-xl tracking-widest italic leading-none active:scale-95 transition-transform">ENTRAR</button>
                    </form>
                    <button onClick={() => setIsRegister(!isRegister)} className="mt-8 text-slate-500 text-[10px] font-black uppercase border-b border-orange-500/30 pb-1 mx-auto italic">
                        {isRegister ? 'Ya tengo cuenta' : 'Regístrate gratis'}
                    </button>
                    <p className="mt-10 text-slate-700 font-bold text-[8px] uppercase tracking-[0.5em] opacity-40">v{APP_VERSION}</p>
                </div>
            );
        }

        function DashboardView({ history, workouts, onStart }) {
            const chartRef = useRef(null);
            useEffect(() => {
                const ctx = document.getElementById('progressChart')?.getContext('2d');
                if (!ctx) return;
                const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                const dataPoints = Array(7).fill(0);
                history.forEach(h => { dataPoints[new Date(h.date).getDay()] += Math.floor(h.totalTime / 60); });
                if (chartRef.current) chartRef.current.destroy();
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: days, datasets: [{ data: dataPoints, backgroundColor: '#f97316', borderRadius: 6 }] },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 9 } } }, x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 } } } } }
                });
                return () => chartRef.current?.destroy();
            }, [history]);

            return (
                <div className="space-y-6 animate-fade-in pb-10">
                    <section>
                        <h2 className="text-[10px] font-black uppercase text-slate-500 mb-3 tracking-widest italic leading-none">Mi Actividad Semanal</h2>
                        <div className="glass-card p-6 h-64 shadow-2xl">
                            <canvas id="progressChart"></canvas>
                        </div>
                    </section>
                    <section>
                        <h2 className="text-[10px] font-black uppercase text-slate-500 mb-3 tracking-widest italic leading-none text-center">Entrenamiento Rápido</h2>
                        <div className="grid grid-cols-1 gap-3">
                            {workouts.slice(0, 3).map(w => (
                                <div key={w.id} onClick={() => onStart(w)} className="glass-card p-5 flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                    <h3 className="font-black italic uppercase text-sm tracking-tight">{w.name}</h3>
                                    <span className="bg-orange-500 text-white w-10 h-10 rounded-full flex items-center justify-center text-xs shadow-lg shadow-orange-500/20">▶</span>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        function WorkoutsView({ workouts, setWorkout, onEdit, onCreate, user, appId, db }) {
            const [deletingId, setDeletingId] = useState(null);
            return (
                <div className="space-y-4 animate-fade-in pb-20">
                    <button onClick={onCreate} className="w-full bg-white text-black py-5 rounded-full font-black uppercase shadow-xl italic tracking-widest active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <span className="text-xl">➕</span> Nueva Rutina
                    </button>
                    {deletingId && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-6 z-[100]">
                            <div className="bg-slate-900 border border-white/5 p-8 rounded-[3rem] w-full max-w-sm text-center">
                                <h2 className="font-black uppercase italic text-xl mb-2 leading-none">¿Borrar?</h2>
                                <p className="text-slate-500 text-[10px] uppercase font-bold tracking-widest mb-8 italic">Eliminar definitivamente</p>
                                <div className="flex flex-col gap-3">
                                    <button onClick={async () => { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts').doc(deletingId).delete(); setDeletingId(null); }} className="bg-red-600 text-white py-4 rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl">ELIMINAR</button>
                                    <button onClick={() => setDeletingId(null)} className="bg-slate-800 text-slate-300 py-4 rounded-3xl font-black uppercase text-xs tracking-widest">CANCELAR</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-1 gap-3">
                        {workouts.map(w => (
                            <div key={w.id} className="glass-card p-6 flex justify-between items-center border-white/10">
                                <div className="flex-1 cursor-pointer" onClick={() => setWorkout(w)}>
                                    <h3 className="font-black italic uppercase text-md leading-none mb-1">{w.name}</h3>
                                    <p className="text-[8px] font-black text-orange-500 mt-1 uppercase tracking-widest italic">{formatTime(w.totalTime)} • HIIT</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setWorkout(w)} className="bg-white text-black px-5 py-3 rounded-2xl font-black text-[10px] italic">GO</button>
                                    <button onClick={() => onEdit(w)} className="bg-slate-800 text-white p-3 rounded-2xl">📝</button>
                                    <button onClick={() => setDeletingId(w.id)} className="bg-red-500/10 text-red-500 p-3 rounded-2xl">🗑️</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CreateView({ onCancel, user, appId, db, workoutToEdit }) {
            const [name, setName] = useState(workoutToEdit ? workoutToEdit.name : '');
            const [phases, setPhases] = useState(workoutToEdit ? workoutToEdit.phases : {
                calentamiento: { action: 30, change: 5, rounds: 1, cycles: 1, rest: 0 },
                entrenamiento: { action: 30, change: 10, rounds: 9, cycles: 4, rest: 60 },
                estiramientos: { action: 20, change: 5, rounds: 4, cycles: 1, rest: 0 }
            });
            const update = (p, f, v) => setPhases(prev => ({...prev, [p]: {...prev[p], [f]: parseInt(v) || 0}}));

            const handleSave = async () => {
                const col = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts');
                if (workoutToEdit) await col.doc(workoutToEdit.id).update({ name, phases, updatedAt: new Date().toISOString() });
                else await col.add({ name, phases, createdAt: new Date().toISOString() });
                onCancel();
            };

            return (
                <div className="flex-1 flex flex-col pb-32 animate-fade-in">
                    <header className="flex items-center gap-4 py-4 mb-4">
                        <button onClick={onCancel} className="p-3 bg-slate-900 rounded-2xl font-bold border border-white/5 leading-none">⬅</button>
                        <h2 className="text-xl font-black uppercase italic leading-none">{workoutToEdit ? 'Editar' : 'Nueva Rutina'}</h2>
                    </header>
                    <div className="space-y-6 overflow-y-auto pr-1 scrollbar-hide pb-10">
                        <input type="text" placeholder="NOMBRE DE RUTINA" className="w-full p-6 bg-slate-900 border border-white/10 rounded-[2rem] font-black text-center uppercase italic focus:border-orange-500 outline-none" value={name} onChange={e => setName(e.target.value)} />
                        {['calentamiento', 'entrenamiento', 'estiramientos'].map((p) => (
                            <div key={p} className="glass-card p-6 italic mb-4">
                                <span className="font-black uppercase text-xs tracking-widest text-orange-500 border-b border-white/5 block mb-6 pb-2 leading-none">{p}</span>
                                <div className="grid grid-cols-2 gap-4">
                                    <InputField label="ACCIÓN (S)" val={phases[p].action} set={v => update(p, 'action', v)} />
                                    <InputField label="CAMBIO (S)" val={phases[p].change} set={v => update(p, 'change', v)} />
                                    <InputField label="RONDAS" val={phases[p].rounds} set={v => update(p, 'rounds', v)} />
                                    <InputField label="CICLOS" val={phases[p].cycles} set={v => update(p, 'cycles', v)} />
                                    <div className="col-span-2"><InputField label="DESCANSO LARGO (S)" val={phases[p].rest} set={v => update(p, 'rest', v)} /></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-slate-950/90 backdrop-blur-xl border-t border-white/5 z-50">
                        <button onClick={handleSave} className="w-full bg-white text-black py-6 rounded-full font-black uppercase shadow-2xl italic tracking-[0.2em] leading-none active:scale-95 transition-transform">GUARDAR RUTINA</button>
                    </div>
                </div>
            );
        }

        function InputField({ label, val, set }) {
            return (
                <div className="flex flex-col gap-1.5">
                    <span className="text-[8px] font-black uppercase opacity-40 leading-none tracking-widest italic">{label}</span>
                    <input type="number" className="w-full bg-white/5 p-4 rounded-2xl text-center font-black text-lg outline-none border border-white/5 focus:border-orange-500/50" value={val} onChange={e => set(e.target.value)} />
                </div>
            );
        }

        function HistoryListView({ history, user, appId, db }) {
            return (
                <div className="space-y-4 animate-fade-in pb-20">
                    <h2 className="text-[10px] font-black uppercase text-slate-500 mb-2 italic tracking-widest leading-none">Mis Sesiones</h2>
                    {history.sort((a,b) => new Date(b.date) - new Date(a.date)).map(h => (
                        <div key={h.id} className="glass-card p-5 flex justify-between items-center border-white/5">
                            <div className="flex-1 pr-4">
                                <h3 className="font-black uppercase italic text-xs leading-none mb-1 truncate">{h.workoutName}</h3>
                                <p className="text-[8px] font-bold text-slate-500 uppercase leading-none italic">{new Date(h.date).toLocaleDateString()} • {formatTime(h.totalTime)}</p>
                            </div>
                            <button onClick={() => db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').doc(h.id).delete()} className="text-slate-700 p-2 leading-none">✕</button>
                        </div>
                    ))}
                </div>
            );
        }

        function PlayerView({ workout, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const wakeLockRef = useRef(null);

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                const REGIONS = ['Piernas', 'Brazos', 'Tronco'];

                // 1. CALENTAMIENTO
                for(let r=1; r<=ph.calentamiento.rounds; r++) {
                    s.push({ label: 'CALIENTA', sec: ph.calentamiento.action, color: 'bg-emerald-600', voice: 'Calienta', phase: 'Calentamiento', r, tr: ph.calentamiento.rounds, cy: 1, tc: 1 });
                    if(r < ph.calentamiento.rounds) s.push({ label: 'CAMBIO', sec: ph.calentamiento.change, color: 'bg-yellow-500', voice: 'Cambio', phase: 'Calentamiento' });
                }
                s.push({ label: 'CAMBIO DE FASE', sec: 5, color: 'bg-yellow-500', voice: 'Prepárate para entrenar', phase: 'Transición' });

                // 2. ENTRENAMIENTO
                for(let cy=1; cy<=ph.entrenamiento.cycles; cy++) {
                    for(let r=1; r<=ph.entrenamiento.rounds; r++) {
                        const regionIdx = Math.floor((r - 1) / 3) % 3;
                        const regionName = REGIONS[regionIdx];
                        const isFirst = (r - 1) % 3 === 0;
                        s.push({ 
                            label: 'ENTRENA',
                            region: regionName.toUpperCase(), 
                            sec: ph.entrenamiento.action, 
                            color: 'bg-emerald-600', 
                            voice: isFirst ? `Entrena ${regionName}` : 'Entrena',
                            phase: 'Entrenamiento',
                            r, tr: ph.entrenamiento.rounds, cy, tc: ph.entrenamiento.cycles
                        });
                        if(r < ph.entrenamiento.rounds) s.push({ label: 'CAMBIO', sec: ph.entrenamiento.change, color: 'bg-yellow-500', voice: 'Cambio', phase: 'Entrenamiento' });
                    }
                    if(cy < ph.entrenamiento.cycles) s.push({ label: 'DESCANSO', sec: ph.entrenamiento.rest, color: 'bg-red-600', voice: 'Descanso', phase: 'Entrenamiento' });
                }
                s.push({ label: 'CAMBIO DE FASE', sec: 5, color: 'bg-yellow-500', voice: 'Prepárate para estirar', phase: 'Transición' });

                // 3. ESTIRAMIENTOS
                for(let r=1; r<=ph.estiramientos.rounds; r++) {
                    s.push({ label: 'ESTIRA', sec: ph.estiramientos.action, color: 'bg-emerald-600', voice: 'Estira', phase: 'Estiramiento', r, tr: ph.estiramientos.rounds, cy: 1, tc: 1 });
                    if(r < ph.estiramientos.rounds) s.push({ label: 'CAMBIO', sec: ph.estiramientos.change, color: 'bg-yellow-500', voice: 'Cambio', phase: 'Estiramiento' });
                }

                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].sec);
            }, [workout]);

            useEffect(() => {
                if (status !== 'running') return;
                const current = steps[idx];
                if (timeLeft === current?.sec) speak(current.voice);
                if (timeLeft <= 3 && timeLeft > 0) speak(timeLeft.toString());
            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(lock => wakeLockRef.current = lock).catch(() => {});
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); 
                                setTimeLeft(steps[idx+1].sec); 
                                if('vibrate' in navigator) navigator.vibrate(200); 
                            } else {
                                setStatus('finished');
                                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            }
                        }
                    }, 1000);
                } else { if (wakeLockRef.current) wakeLockRef.current.release(); }
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps]);

            if (status === 'finished') return (
                <div className="h-full w-full flex flex-col items-center justify-center p-8 text-center bg-slate-950 overflow-hidden">
                    <div className="text-9xl mb-4 animate-bounce">🏆</div>
                    <h2 className="text-5xl font-black uppercase italic leading-none mb-10 tracking-tighter">¡HECHO!</h2>
                    <div className="glass-card p-10 w-full mb-12 shadow-2xl border-orange-500/20 text-center uppercase italic">
                        <p className="text-[10px] font-black text-slate-500 mb-2 tracking-[0.4em]">Resumen de Sesión</p>
                        <p className="text-7xl font-black text-orange-500 leading-none">{formatTime(elapsed)}</p>
                    </div>
                    <button onClick={() => onComplete(workout.name, elapsed)} className="w-full bg-white text-black py-8 rounded-full font-black uppercase shadow-2xl italic tracking-widest max-w-sm text-xl active:scale-95 transition-transform">FINALIZAR</button>
                </div>
            );

            const curr = steps[idx];
            const circ = 2 * Math.PI * 42; 
            const offset = circ - ((curr?.sec - timeLeft) / curr?.sec) * circ;

            return (
                <div className={`h-screen w-screen flex flex-col transition-colors duration-500 ${curr?.color || 'bg-slate-950'} text-white overflow-hidden`}>
                    
                    {/* TOP HUD PRO */}
                    <div className="flex justify-between items-start p-4 z-30 relative shrink-0 h-[12vh]">
                        <button onClick={onExit} className="bg-black/20 px-6 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest border border-white/5 active:scale-90 transition-transform italic leading-none">✖ SALIR</button>
                        <div className="text-right">
                             <div className="bg-white/20 px-3 py-1 rounded-xl text-[10px] font-black border border-white/5 backdrop-blur-md flex items-center gap-2 italic">
                                <span className="opacity-40">TIME:</span> {formatTime(elapsed)}
                             </div>
                        </div>
                    </div>

                    {/* MAIN CONSOLE - HUD DE ALTO RENDIMIENTO */}
                    <div className="flex-1 grid grid-cols-3 items-center w-full px-6 landscape:px-12 relative overflow-hidden">
                        
                        {/* IZQUIERDA: PANEL DE RONDAS */}
                        <div className="flex flex-col items-center justify-center h-[55vh] rounded-[2.5rem] bg-black/25 border border-white/5 shadow-2xl backdrop-blur-sm">
                            <span className="text-[1.5vh] font-black uppercase tracking-[0.4em] opacity-40 mb-[1vh] italic leading-none">RONDAS</span>
                            <div className="text-[8vh] font-black italic tabular-nums leading-none mb-[1vh]">{curr?.r || 1}<span className="text-[3vh] opacity-20 mx-1">/</span>{curr?.tr || 1}</div>
                            <div className="bg-white/10 px-3 py-1 rounded-full text-[1.4vh] font-bold tracking-tighter opacity-50 uppercase italic leading-none">Faltan: {(curr?.tr || 1) - (curr?.r || 1)}</div>
                        </div>

                        {/* CENTRO: TIMER DINÁMICO */}
                        <div className="flex flex-col items-center justify-center h-full relative">
                            {/* ETIQUETA DE FASE Y REGIÓN */}
                            <div className="absolute top-[0vh] w-full text-center">
                                 <h3 className="text-[1.8vh] uppercase tracking-[0.6em] font-black text-white/40 mb-[0.5vh] italic drop-shadow-md leading-none">{curr?.phase}</h3>
                                 <h2 className="text-[5vh] font-black uppercase italic tracking-tighter drop-shadow-2xl leading-none text-white">{curr?.region || curr?.label}</h2>
                            </div>

                            {/* CÍRCULO TIMER (AJUSTADO A 40vh PARA EVITAR DESBORDE) */}
                            <div className="relative flex items-center justify-center w-[40vh] h-[40vh] mt-[4vh]">
                                <svg className="absolute w-full h-full" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.08)" strokeWidth="10" fill="none" />
                                    <circle cx="50" cy="50" r="42" stroke="white" strokeWidth="10" fill="none" className="progress-ring__circle" style={{ strokeDasharray: circ, strokeDashoffset: offset }} />
                                </svg>
                                <div className="text-[14vh] font-black tabular-nums drop-shadow-2xl italic leading-none z-10">{timeLeft}</div>
                            </div>

                            {/* MANDOS DE REPRODUCCIÓN */}
                            <div className="mt-[3vh] flex items-center gap-[5vh]">
                                <button onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} className="bg-white text-black w-[9vh] h-[9vh] rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-all text-[4vh] leading-none">
                                    {status === 'running' ? '⏸' : '▶'}
                                </button>
                                <button onClick={() => setTimeLeft(0)} className="bg-white/20 w-[6vh] h-[6vh] rounded-full text-[2.5vh] flex items-center justify-center border border-white/10 active:scale-90 italic leading-none">⏭</button>
                            </div>
                        </div>

                        {/* DERECHA: PANEL DE CICLOS */}
                        <div className="flex flex-col items-center justify-center h-[55vh] rounded-[2.5rem] bg-black/25 border border-white/5 shadow-2xl backdrop-blur-sm">
                            <span className="text-[1.5vh] font-black uppercase tracking-[0.4em] opacity-40 mb-[1vh] italic leading-none">CICLOS</span>
                            <div className="text-[8vh] font-black italic tabular-nums leading-none mb-[1vh]">{curr?.cy || 1}<span className="text-[3vh] opacity-20 mx-1">/</span>{curr?.tc || 1}</div>
                            <div className="bg-white/10 px-3 py-1 rounded-full text-[1.4vh] font-bold tracking-tighter opacity-50 uppercase italic leading-none">Faltan: {(curr?.tc || 1) - (curr?.cy || 1)}</div>
                        </div>
                    </div>

                    {/* MARGEN DE SEGURIDAD INFERIOR */}
                    <div className="h-[3vh] shrink-0"></div>
                </div>
            );
        }

        function AdminView({ onBack, appId, db }) {
            const [users, setUsers] = useState([]);
            useEffect(() => {
                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').onSnapshot(s => setUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);
            return (
                <div className="animate-fade-in space-y-4 pb-20">
                    <button onClick={onBack} className="p-4 bg-slate-900 rounded-2xl font-black text-xs tracking-widest border border-white/5 mb-6 uppercase italic italic leading-none">⬅ VOLVER AL DASHBOARD</button>
                    <div className="grid gap-3">
                        {users.map(u => (
                            <div key={u.id} className="glass-card p-6 flex justify-between items-center shadow-sm">
                                <div className="truncate text-left pr-4">
                                    <h4 className="font-bold text-[11px] text-white/90 truncate">{u.email}</h4>
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1 italic leading-none">PASS: {u.password}</p>
                                </div>
                                <button onClick={async () => { if(confirm("¿Limpiar registro?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').doc(u.id).delete(); }} className="bg-red-500/20 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black border border-red-500/30 uppercase italic leading-none">Limpiar</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
