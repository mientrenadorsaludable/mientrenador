<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / App Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <title>Mi entrenador Fuerte y saludable | App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --bg-main: #020617;
            --accent: #f97316;
            --neon-cyan: #22d3ee;
            --neon-green: #4ade80;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; background-color: var(--bg-main); }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.02); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        :fullscreen { background-color: #020617; }
        :-webkit-full-screen { background-color: #020617; }

        .neon-text-orange { text-shadow: 0 0 40px rgba(249, 115, 22, 0.9); }
        .neon-text-cyan { text-shadow: 0 0 40px rgba(34, 211, 238, 0.9); }
        .neon-text-green { text-shadow: 0 0 40px rgba(74, 222, 128, 0.9); }
        
        .pie-background { fill: rgba(255, 255, 255, 0.03); }

        .btn-filter-active {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
        }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; background: #f97316; border-radius: 50%; margin-top: -6px; cursor: pointer; box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mientrenador-v3";
        const APP_TITLE = "Mi entrenador Fuerte y saludable";
        const APP_VERSION = "9.5.0"; 

        // --- FUNCIONES DE APOYO ---
        const formatTime = (s) => `${Math.floor(s / 60)}:${((s || 0) % 60).toString().padStart(2, '0')}`;

        // Componente auxiliar para inputs
        function InputField({ label, val, set }) {
            return (
                <div className="flex flex-col gap-1.5 items-center text-center">
                    <span className="text-[8px] font-black uppercase opacity-40 leading-none tracking-widest italic text-center text-white uppercase">{label}</span>
                    <input type="number" className="w-full bg-white/5 p-4 rounded-2xl text-center font-black text-lg outline-none border border-orange-500/50 text-center leading-none text-white text-center" value={val} onChange={e => set(e.target.value)} />
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('workouts'); 
            const [workouts, setWorkouts] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [editingWorkout, setEditingWorkout] = useState(null);
            
            // Estado global de música
            const [musicMode, setMusicMode] = useState('off');
            const [musicVolume, setMusicVolume] = useState(0.35);
            const audioRef = useRef(null);

            const INTERNAL_TRACKS = {
                workout: "https://stream.zeno.fm/f36768a88h0uv",
                lofi: "https://stream.zeno.fm/0r0xa792kwzuv"
            };

            // Función speak con ducking (bajar volumen de música)
            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'es-ES';
                msg.rate = 1.15;

                // Al empezar a hablar: Bajar volumen música
                msg.onstart = () => {
                    if (audioRef.current && musicMode !== 'off') {
                        audioRef.current.volume = musicVolume * 0.1; // Baja al 10% del configurado
                    }
                };

                // Al terminar de hablar: Restaurar volumen música
                msg.onend = () => {
                    if (audioRef.current && musicMode !== 'off') {
                        audioRef.current.volume = musicVolume;
                    }
                };

                window.speechSynthesis.speak(msg);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    setTimeout(() => setLoading(false), 3000);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                const unsubW = pathBase.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = pathBase.collection('history').onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubW(); unsubH(); };
            }, [user]);

            useEffect(() => {
                if (!audioRef.current) audioRef.current = new Audio();
                const audio = audioRef.current;
                audio.volume = musicVolume;
                if (musicMode !== 'off' && INTERNAL_TRACKS[musicMode]) {
                    if (audio.src !== INTERNAL_TRACKS[musicMode]) audio.src = INTERNAL_TRACKS[musicMode];
                    audio.play().catch(() => {});
                } else { audio.pause(); }
            }, [musicMode, musicVolume]);

            const startWorkout = async (w) => {
                setSelectedWorkout(w);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch (err) {}
                setView('play');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white overflow-hidden text-center text-center">
                    <div className="relative z-10 flex flex-col items-center animate-fade-in text-center px-6 mx-auto">
                        <div className="text-9xl mb-6 drop-shadow-[0_0_40px_rgba(249,115,22,0.4)] animate-pulse-slow">🏋️‍♂️</div>
                        <h1 className="text-4xl font-black italic uppercase tracking-tighter mb-4 leading-tight">{APP_TITLE}</h1>
                        <div className="mt-4 flex flex-col items-center gap-3">
                            <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                            <span className="text-slate-600 font-black text-[10px] tracking-[0.5em] uppercase italic text-center">Versión {APP_VERSION}</span>
                        </div>
                    </div>
                </div>
            );

            if (!user) return <AuthView appId={appId} db={db} auth={auth} />;

            return (
                <div className="h-full w-full flex flex-col relative bg-slate-950 overflow-hidden text-center text-center">
                    {view !== 'play' && (
                        <header className="p-6 flex justify-between items-center bg-slate-900 shadow-2xl shrink-0 border-b border-white/5 text-white">
                            <div onClick={() => setView('workouts')} className="cursor-pointer text-white text-left">
                                <h1 className="text-lg font-black italic uppercase leading-none tracking-tight">{APP_TITLE}</h1>
                                <p className="text-[9px] font-bold text-slate-500 lowercase italic tracking-wider mt-1">{user.email}</p>
                            </div>
                            <div className="flex gap-2 leading-none text-center">
                                <button onClick={() => auth.signOut()} className="p-2 bg-red-500/10 rounded-xl text-red-500 font-bold border border-red-500/20 text-lg flex items-center justify-center text-white">🚪</button>
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 overflow-y-auto scrollbar-hide w-full ${view === 'play' ? 'p-0 h-full' : 'p-4 max-w-2xl mx-auto'}`}>
                        {view === 'avance' && <AvanceView history={history} />}
                        {view === 'workouts' && <WorkoutsView workouts={workouts} setWorkout={startWorkout} onEdit={(w) => { setEditingWorkout(w); setView('create'); }} onCreate={() => { setEditingWorkout(null); setView('create'); }} user={user} appId={appId} db={db} />}
                        {view === 'history' && <HistoryListView history={history} user={user} appId={appId} db={db} />}
                        {view === 'create' && <CreateView onCancel={() => { setView('workouts'); setEditingWorkout(null); }} user={user} appId={appId} db={db} workoutToEdit={editingWorkout} />}
                        {view === 'music' && <MusicHubView mode={musicMode} setMode={setMusicMode} volume={musicVolume} setVolume={setMusicVolume} onBack={() => setView('workouts')} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} speak={speak} onExit={() => {
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts');
                        }} onComplete={(name, time) => {
                            db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() });
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts');
                        }} />}
                    </main>

                    {view !== 'play' && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/5 p-4 flex justify-around items-center z-50 shadow-2xl">
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[9px] font-black ${view === 'workouts' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center">🏋️</span> MIS RUTINAS
                            </button>
                            <button onClick={() => setView('music')} className={`flex flex-col items-center text-[9px] font-black ${view === 'music' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center">🎵</span> MÚSICA
                            </button>
                            <button onClick={() => setView('avance')} className={`flex flex-col items-center text-[9px] font-black ${view === 'avance' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center">📊</span> AVANCE
                            </button>
                            <button onClick={() => setView('history')} className={`flex flex-col items-center text-[9px] font-black ${view === 'history' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center">📜</span> HISTORIAL
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        function AuthView({ appId, db, auth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [isRegister, setIsRegister] = useState(false);
            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    let res;
                    if (isRegister) res = await auth.createUserWithEmailAndPassword(email.trim(), password);
                    else res = await auth.signInWithEmailAndPassword(email.trim(), password);
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').doc(res.user.uid).set({
                        email: email.trim(), password, lastActivity: new Date().toISOString()
                    }, { merge: true });
                } catch (err) {}
            };
            return (
                <div className="h-full w-full flex flex-col items-center bg-slate-950 overflow-y-auto px-10 pb-40 pt-16 scrollbar-hide text-center text-white">
                    <div className="text-7xl mb-6 animate-pulse-slow mx-auto text-center text-white">🏃‍♂️</div>
                    <h1 className="text-3xl font-black italic uppercase leading-none mb-1 tracking-tighter text-white italic text-center">{APP_TITLE}</h1>
                    <p className="text-orange-500 font-bold uppercase text-[9px] tracking-[0.3em] mb-12 italic text-center">Fuerte y Saludable</p>
                    <form onSubmit={handleAuth} className="space-y-4 max-w-sm w-full text-center">
                        <input type="email" placeholder="EMAIL" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-xs shadow-inner text-white text-center" value={email} onChange={e => setEmail(e.target.value)} required />
                        <div className="relative text-center">
                            <input type={showPass ? "text" : "password"} placeholder="PASSWORD" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-xs shadow-inner text-white text-center" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-6 top-6 text-xl leading-none flex items-center justify-center text-white/50">{showPass ? '🙈' : '👁️'}</button>
                        </div>
                        <button type="submit" className="w-full bg-orange-500 py-6 rounded-full font-black uppercase shadow-xl tracking-widest italic leading-none active:scale-95 transition-transform text-white text-center">ENTRAR</button>
                    </form>
                    <button onClick={() => setIsRegister(!isRegister)} className="mt-8 text-slate-500 text-[10px] font-black uppercase border-b border-orange-500/30 pb-1 mx-auto italic text-center">{isRegister ? 'Ya tengo cuenta' : 'Regístrate gratis'}</button>
                </div>
            );
        }

        function AvanceView({ history }) {
            const chartRef = useRef(null);
            const [filter, setFilter] = useState('semana');
            useEffect(() => {
                const ctx = document.getElementById('progressChart')?.getContext('2d');
                if (!ctx) return;
                let labels = [], dataPoints = [];
                const now = new Date();
                if (filter === 'semana') {
                    labels = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                    dataPoints = Array(7).fill(0);
                    history.forEach(h => {
                        const d = new Date(h.date);
                        if (Math.abs(now - d) <= (7 * 24 * 60 * 60 * 1000)) dataPoints[d.getDay()] += Math.floor(h.totalTime / 60);
                    });
                } else if (filter === 'mes') {
                    const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                    labels = Array.from({length: days}, (_, i) => (i + 1).toString());
                    dataPoints = Array(days).fill(0);
                    history.forEach(h => {
                        const d = new Date(h.date);
                        if (d.getMonth() === now.getMonth()) dataPoints[d.getDate() - 1] += Math.floor(h.totalTime / 60);
                    });
                } else {
                    labels = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                    dataPoints = Array(12).fill(0);
                    history.forEach(h => {
                        const d = new Date(h.date);
                        if (d.getFullYear() === now.getFullYear()) dataPoints[d.getMonth()] += Math.floor(h.totalTime / 60);
                    });
                }
                if (chartRef.current) chartRef.current.destroy();
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: { labels, datasets: [{ data: dataPoints, backgroundColor: '#f97316', borderRadius: 4 }] },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 9 } } }, x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 } } } } }
                });
                return () => chartRef.current?.destroy();
            }, [history, filter]);
            return (
                <div className="space-y-6 animate-fade-in pb-20 text-center text-white">
                    <section>
                        <div className="flex justify-between items-end mb-4 px-2 text-center text-center">
                            <h2 className="text-[10px] font-black uppercase text-slate-500 tracking-widest italic leading-none text-left text-center">Mi Avance (Min)</h2>
                            <div className="flex gap-1 bg-slate-900 p-1 rounded-xl border border-white/5 leading-none">
                                {['semana', 'mes', 'año'].map(f => (
                                    <button key={f} onClick={() => setFilter(f)} className={`px-3 py-1.5 rounded-lg text-[8px] font-black uppercase transition-all leading-none ${filter === f ? 'btn-filter-active' : 'text-slate-500'}`}>{f}</button>
                                ))}
                            </div>
                        </div>
                        <div className="glass-card p-6 h-64 shadow-2xl relative overflow-hidden mx-auto w-full text-center">
                             <canvas id="progressChart"></canvas>
                        </div>
                    </section>
                </div>
            );
        }

        function WorkoutsView({ workouts, setWorkout, onEdit, onCreate, user, appId, db }) {
            return (
                <div className="space-y-4 animate-fade-in pb-32 text-center text-white">
                    <div className="grid grid-cols-1 gap-3 text-center mx-auto w-full">
                        {workouts.map(w => (
                            <div key={w.id} className="glass-card p-6 flex justify-between items-center border-white/10 text-left text-center">
                                <div className="flex-1 cursor-pointer truncate text-center" onClick={() => setWorkout(w)}>
                                    <h3 className="font-black italic uppercase text-md leading-none mb-2 truncate text-white">{w.name}</h3>
                                    <p className="text-[10px] font-black text-orange-500 uppercase tracking-widest italic leading-none text-center text-center">Duración: {formatTime(w.totalTime || 0)}</p>
                                </div>
                                <div className="flex gap-2 leading-none text-center">
                                    <button onClick={() => setWorkout(w)} className="bg-white text-black px-5 py-3 rounded-2xl font-black text-[10px] italic leading-none flex items-center justify-center text-center text-white">GO</button>
                                    <button onClick={() => onEdit(w)} className="bg-slate-800 text-white p-3 rounded-2xl leading-none flex items-center justify-center text-center text-white">📝</button>
                                    <button onClick={() => db.collection(`artifacts/${appId}/users/${user.uid}/workouts`).doc(w.id).delete()} className="bg-red-500/10 text-red-500 p-3 rounded-2xl leading-none flex items-center justify-center text-center text-white text-center">🗑️</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={onCreate} className="w-full bg-white/5 border border-white/10 text-white py-5 rounded-full font-black uppercase shadow-xl italic tracking-widest active:scale-95 transition-transform flex items-center justify-center gap-2 leading-none mt-4 text-center">
                        <span className="text-xl leading-none">➕</span> NUEVA RUTINA
                    </button>
                </div>
            );
        }

        function MusicHubView({ mode, setMode, volume, setVolume, onBack }) {
            const SERVICES = [
                { name: 'Gospel Library', url: 'gospellibrary://', fallback: 'https://www.churchofjesuschrist.org/study' },
                { name: 'Spotify', url: 'spotify:', fallback: 'https://open.spotify.com' },
                { name: 'Amazon Music', url: 'https://music.amazon.com' },
                { name: 'YouTube Music', url: 'https://music.youtube.com' }
            ];
            const openMusic = (url, fallback) => {
                window.location.assign(url);
                setTimeout(() => { if (fallback) window.location.assign(fallback); }, 1500);
            };
            return (
                <div className="flex-1 flex flex-col items-center bg-slate-950 px-6 pt-10 pb-40 animate-fade-in text-center text-white">
                    <h2 className="text-2xl font-black italic uppercase tracking-tight mb-8 text-white">Centro de Música</h2>
                    <div className="w-full max-w-sm glass-card p-8 mb-8 space-y-6">
                        <div className="space-y-4 text-center">
                            <div className="flex justify-between text-[10px] font-black uppercase opacity-60 italic text-white text-center text-center">
                                <span>Volumen Canales Internos</span>
                                <span>{Math.round(volume * 100)}%</span>
                            </div>
                            <input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e) => setVolume(parseFloat(e.target.value))} className="w-full" />
                            <p className="text-[8px] font-bold text-orange-500 opacity-60 uppercase italic text-center">* La música bajará sola cuando el entrenador hable.</p>
                        </div>
                        <div className="grid gap-3 pt-4 text-center">
                            <button onClick={() => setMode('off')} className={`py-4 rounded-2xl text-xs font-black uppercase transition-all ${mode === 'off' ? 'bg-orange-500 text-white shadow-xl shadow-orange-500/20' : 'bg-white/5 text-slate-400'}`}>Silencio</button>
                            <button onClick={() => setMode('workout')} className={`py-4 rounded-2xl text-xs font-black uppercase transition-all ${mode === 'workout' ? 'bg-orange-500 text-white shadow-xl shadow-orange-500/20' : 'bg-white/5 text-slate-400'}`}>Workout Mix 🔥</button>
                            <button onClick={() => setMode('lofi')} className={`py-4 rounded-2xl text-xs font-black uppercase transition-all ${mode === 'lofi' ? 'bg-orange-500 text-white shadow-xl shadow-orange-500/20' : 'bg-white/5 text-slate-400'}`}>Lofi Chill ☕</button>
                        </div>
                    </div>
                    <div className="w-full max-w-sm text-center">
                        <p className="text-[10px] font-black uppercase opacity-40 mb-4 tracking-[0.3em] text-center italic text-white">Streaming Externo</p>
                        <div className="grid grid-cols-2 gap-3 text-center text-white">
                            {SERVICES.map(s => (
                                <button key={s.name} onClick={() => { setMode('off'); openMusic(s.url, s.fallback); }} className="bg-slate-900 border border-white/5 p-5 rounded-3xl text-[9px] font-black uppercase hover:bg-white/10 transition-all text-center">
                                    {s.name}
                                </button>
                            ))}
                        </div>
                        <p className="text-[7px] mt-4 opacity-40 uppercase italic text-center leading-relaxed">* Nota: Las apps externas (Spotify, etc.) se gestionan desde el sistema de tu celular.</p>
                    </div>
                </div>
            );
        }

        function CreateView({ onCancel, user, appId, db, workoutToEdit }) {
            const [name, setName] = useState(workoutToEdit ? workoutToEdit.name : '');
            const [transition, setTransition] = useState(workoutToEdit?.transition || 10);
            const [sectionTransition, setSectionTransition] = useState(workoutToEdit?.sectionTransition || 10);
            const [phases, setPhases] = useState(workoutToEdit ? workoutToEdit.phases : {
                calentamiento: { action: 10, change: 3, rounds: 8, cycles: 1, rest: 0 },
                entrenamiento: { action: 30, change: 10, rounds: 9, cycles: 4, rest: 60 },
                estiramientos: { action: 30, change: 5, rounds: 17, cycles: 1, rest: 0 }
            });
            const update = (p, f, v) => setPhases(prev => ({...prev, [p]: {...prev[p], [f]: parseInt(v) || 0}}));
            const handleSave = async () => {
                if (!name.trim()) return;
                const col = db.collection(`artifacts/${appId}/users/${user.uid}/workouts`);
                const data = { 
                    name, phases, 
                    transition: parseInt(transition) || 10, 
                    sectionTransition: parseInt(sectionTransition) || 10,
                    updatedAt: new Date().toISOString() 
                };
                if (workoutToEdit) await col.doc(workoutToEdit.id).update(data);
                else await col.add({ ...data, createdAt: new Date().toISOString() });
                onCancel();
            };
            return (
                <div className="flex-1 flex flex-col items-center bg-slate-950 overflow-y-auto px-4 pb-40 scrollbar-hide text-center mx-auto w-full text-white italic text-center text-center">
                    <header className="w-full flex items-center gap-4 py-6 text-center text-white italic text-center">
                        <button onClick={onCancel} className="p-3 bg-slate-900 rounded-2xl font-bold border border-white/5 leading-none flex items-center justify-center text-white">⬅</button>
                        <h2 className="text-xl font-black uppercase italic leading-none text-center flex-1 text-white text-center text-center text-center text-center">{workoutToEdit ? 'EDITAR RUTINA' : 'NUEVA RUTINA'}</h2>
                    </header>
                    <div className="w-full space-y-6 max-w-lg mx-auto text-center italic text-center">
                        <div className="bg-slate-900/60 p-6 rounded-[2rem] border border-white/5 space-y-4 text-white">
                            <label className="text-[10px] font-black uppercase tracking-widest text-orange-500 block leading-none text-center text-center">Nombre del Plan</label>
                            <input type="text" placeholder="NOMBRE DE RUTINA" className="w-full bg-slate-800/40 p-4 rounded-2xl font-black text-center uppercase focus:border-orange-500 outline-none text-white text-center text-center" value={name} onChange={e => setName(e.target.value)} />
                            <div className="grid grid-cols-2 gap-4 pt-2 text-center text-white">
                                <div className="text-center text-white">
                                    <label className="text-[9px] font-black uppercase tracking-widest text-orange-500 block leading-tight mb-2 text-center text-center">Transición fases (S)</label>
                                    <input type="number" className="w-full bg-slate-800/40 p-4 rounded-2xl font-black text-center focus:border-orange-500 outline-none text-white text-center text-center" value={transition} onChange={e => setTransition(e.target.value)} />
                                </div>
                                <div className="text-center text-white text-center">
                                    <label className="text-[9px] font-black uppercase tracking-widest text-orange-500 block leading-tight mb-2 text-center text-center">Transición secciones (S)</label>
                                    <input type="number" className="w-full bg-slate-800/40 p-4 rounded-2xl font-black text-center focus:border-orange-500 outline-none text-white text-center text-center" value={sectionTransition} onChange={e => setSectionTransition(e.target.value)} />
                                </div>
                            </div>
                        </div>
                        {['calentamiento', 'entrenamiento', 'estiramientos'].map((p) => (
                            <div key={p} className="glass-card p-6 italic mb-4 text-center text-center text-center text-center text-center">
                                <span className="font-black uppercase text-xs tracking-widest text-orange-500 border-b border-white/5 block mb-6 pb-2 leading-none mx-auto w-fit text-center uppercase">{p}</span>
                                <div className="grid grid-cols-2 gap-4 mt-4 text-center text-center">
                                    <InputField label="ACCIÓN (S)" val={phases[p].action} set={v => update(p, 'action', v)} />
                                    <InputField label="CAMBIO (S)" val={phases[p].change} set={v => update(p, 'change', v)} />
                                    <InputField label="RONDAS" val={phases[p].rounds} set={v => update(p, 'rounds', v)} />
                                    <InputField label="CICLOS" val={phases[p].cycles} set={v => update(p, 'cycles', v)} />
                                    <div className="col-span-2 text-center text-center text-center"><InputField label="DESCANSO AL FINAL DE CICLO (S)" val={phases[p].rest} set={v => update(p, 'rest', v)} /></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-slate-950/90 backdrop-blur-xl border-t border-white/5 z-50 text-center">
                        <button onClick={handleSave} className="w-full bg-white text-black py-6 rounded-full font-black uppercase shadow-2xl italic tracking-[0.2em] leading-none active:scale-95 transition-transform max-w-sm mx-auto text-center text-white text-center text-center text-center text-center">
                            {workoutToEdit ? 'GUARDAR MODIFICACIONES' : 'CREAR RUTINA'}
                        </button>
                    </div>
                </div>
            );
        }

        function HistoryListView({ history, user, appId, db }) {
            return (
                <div className="space-y-4 animate-fade-in pb-20 text-center mx-auto w-full text-white italic text-center text-center">
                    <h2 className="text-[10px] font-black uppercase text-slate-500 mb-2 italic tracking-widest leading-none text-center italic text-center">Historial de Sesiones</h2>
                    {history.sort((a,b) => new Date(b.date) - new Date(a.date)).map(h => (
                        <div key={h.id} className="glass-card p-5 flex justify-between items-center border-white/5 text-left text-center text-center">
                            <div className="flex-1 pr-4 truncate text-center text-center text-center">
                                <h3 className="font-black uppercase italic text-xs leading-none mb-1 truncate text-center text-white italic">{h.workoutName}</h3>
                                <p className="text-[8px] font-bold text-slate-500 uppercase leading-none italic text-center tracking-tighter text-center text-center">{new Date(h.date).toLocaleDateString()} • {formatTime(h.totalTime)}</p>
                            </div>
                            <button onClick={() => db.collection(`artifacts/${appId}/users/${user.uid}/history`).doc(h.id).delete()} className="text-slate-700 p-2 leading-none flex items-center justify-center text-center text-center text-center">✕</button>
                        </div>
                    ))}
                </div>
            );
        }

        function PlayerView({ workout, speak, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const wakeLockRef = useRef(null); 
            const savedRef = useRef(false);

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                const transTime = workout.transition || 10;
                const secTransTime = workout.sectionTransition || 10;
                const REGIONS = ['Piernas', 'Brazos', 'Tronco'];
                const WARMUP_ORDER = ['tobillos', 'tobillos', 'rodillas', 'rodillas', 'cintura', 'brazos', 'brazos', 'cabeza'];

                s.push({ label: 'PREPARACIÓN', sec: 30, color: 'bg-slate-800', voice: 'Prepárate', phase: 'Iniciando', r: 1, tr: 1, cy: 1, tc: 1, bodySection: 'PREPARACIÓN' });

                const phasesOrder = [{ id: 'calentamiento', label: 'Calentamiento' }, { id: 'entrenamiento', label: 'Entrenamiento' }, { id: 'estiramientos', label: 'Estiramiento' }];

                phasesOrder.forEach((pInfo, pIdx) => {
                    const c = ph[pInfo.id];
                    for(let cy=1; cy<=c.cycles; cy++) {
                        for(let r=1; r<=c.rounds; r++) {
                            let voiceMsg = 'Empieza';
                            let bodySection = pInfo.label.toUpperCase();
                            
                            if (pInfo.id === 'calentamiento') {
                                const joint = WARMUP_ORDER[(r-1) % WARMUP_ORDER.length];
                                bodySection = joint.toUpperCase();
                                voiceMsg = "Calienta " + joint;
                            } else if (pInfo.id === 'entrenamiento') {
                                const regionIdx = Math.floor((r - 1) / 3) % 3;
                                bodySection = REGIONS[regionIdx].toUpperCase();
                                voiceMsg = "Ejercita " + REGIONS[regionIdx];
                            } else if (pInfo.id === 'estiramientos') voiceMsg = "Estira";

                            s.push({ label: bodySection, sec: c.action, color: 'bg-emerald-600', voice: voiceMsg, phase: pInfo.label, r, tr: c.rounds, cy, tc: c.cycles, bodySection });
                            
                            if(r < c.rounds) {
                                if (pInfo.id === 'entrenamiento' && r % 3 === 0) {
                                    const nextRegionIdx = Math.floor(r / 3) % 3;
                                    s.push({ label: 'CAMBIO SECCIÓN', sec: secTransTime, color: 'bg-yellow-500', voice: "Prepárate para ejercitar " + REGIONS[nextRegionIdx], phase: pInfo.label, r, tr: c.rounds, cy, tc: c.cycles, bodySection: 'CAMBIO SECCIÓN' });
                                } else if (pInfo.id === 'calentamiento') {
                                    const currentJoint = WARMUP_ORDER[(r-1) % WARMUP_ORDER.length];
                                    const nextJointIdx = r % WARMUP_ORDER.length;
                                    const nextJoint = WARMUP_ORDER[nextJointIdx];
                                    const transitionVoice = (currentJoint !== nextJoint) ? "Prepárate para calentar " + nextJoint : "Cambio";
                                    s.push({ label: 'CAMBIO', sec: c.change, color: 'bg-yellow-500', voice: transitionVoice, phase: pInfo.label, r, tr: c.rounds, cy, tc: c.cycles, bodySection: 'CAMBIO' });
                                } else {
                                    s.push({ label: 'CAMBIO', sec: c.change, color: 'bg-yellow-500', voice: 'Cambio', phase: pInfo.label, r, tr: c.rounds, cy, tc: c.cycles, bodySection: 'CAMBIO' });
                                }
                            }
                        }
                        if(cy < c.cycles) s.push({ label: 'DESCANSO', sec: c.rest, color: 'bg-red-600', voice: 'Descanso', phase: pInfo.label, r: 'R', tr: c.rounds, cy, tc: c.cycles, bodySection: 'DESCANSO' });
                    }
                    if(pIdx < phasesOrder.length - 1) {
                        const nextPhase = phasesOrder[pIdx+1];
                        let transitionVoice = "Prepárate para ejercitar ";
                        if (nextPhase.id === 'entrenamiento') transitionVoice += "piernas";
                        else if (nextPhase.id === 'estiramientos') transitionVoice += "estiramientos";
                        s.push({ label: 'TRANSICIÓN', sec: transTime, color: 'bg-yellow-500', voice: transitionVoice, phase: 'Transición', r: 0, tr: 0, cy: 0, tc: 0, bodySection: 'SIGUIENTE FASE' });
                    }
                });
                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].sec);
            }, [workout]);

            useEffect(() => {
                if (status !== 'running') return;
                const current = steps[idx];
                if (timeLeft === current?.sec) speak(current.voice);
                if (timeLeft <= 3 && timeLeft > 0) speak(timeLeft.toString());
            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(lock => { wakeLockRef.current = lock; }).catch(() => {});
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); setTimeLeft(steps[idx+1].sec); 
                                if('vibrate' in navigator) navigator.vibrate(200); 
                            } else {
                                // FINALIZACIÓN DEL WORKOUT
                                speak("ejercicio terminado, lo lograste");
                                setStatus('finished');
                                if (!savedRef.current) { onComplete(workout.name, elapsed + 1); savedRef.current = true; }
                                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            }
                        }
                    }, 1000);
                } else { if (wakeLockRef.current) { wakeLockRef.current.release().catch(()=>{}); wakeLockRef.current = null; } }
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps, workout, elapsed, onComplete]);

            const totalWorkoutSeconds = useMemo(() => steps.reduce((acc, curr) => acc + curr.sec, 0), [steps]);

            if (status === 'finished') return (
                <div className="h-full w-full flex flex-col items-center justify-center p-8 text-center bg-slate-950 overflow-hidden text-white italic">
                    <div className="text-9xl mb-4 animate-bounce text-center mx-auto leading-none flex items-center justify-center text-white text-center text-center">🏆</div>
                    <h2 className="text-5xl font-black uppercase italic leading-none mb-10 tracking-tighter text-center text-white text-center text-center">¡HECHO!</h2>
                    <div className="glass-card p-10 w-full mb-12 shadow-2xl border-orange-500/20 text-center uppercase italic text-center mx-auto text-center">
                        <p className="text-[10px] font-black text-slate-500 mb-2 tracking-[0.4em] text-center leading-none italic text-center text-center">Resumen de sesión</p>
                        <p className="text-7xl font-black text-orange-500 leading-none text-center pt-2 italic">{formatTime(elapsed)}</p>
                    </div>
                    <button onClick={() => onExit()} className="w-full bg-white text-black py-8 rounded-full font-black uppercase shadow-2xl italic tracking-widest max-w-sm text-xl active:scale-95 transition-transform text-center mx-auto leading-none italic text-center">FINALIZAR</button>
                </div>
            );

            const curr = steps[idx];
            const roundPercentage = curr?.tr ? (Math.min(1, (parseInt(curr.r) || 0) / curr.tr)) : 0;
            const cyclePercentage = curr?.tc ? (Math.min(1, (parseInt(curr.cy) || 0) / curr.tc)) : 0;
            const sessionPercentage = totalWorkoutSeconds ? (Math.min(1, elapsed / totalWorkoutSeconds)) : 0;
            const timerPercentage = curr?.sec ? (Math.min(1, (curr.sec - timeLeft) / curr.sec)) : 0;

            const pieCirc = 2 * Math.PI * 20;
            const roundPieOffset = pieCirc - (roundPercentage * pieCirc);
            const cyclePieOffset = pieCirc - (cyclePercentage * pieCirc);
            const sessionPieOffset = pieCirc - (sessionPercentage * pieCirc);
            const timerPieOffset = pieCirc - (timerPercentage * pieCirc);

            return (
                <div className={`h-screen w-screen flex flex-col transition-colors duration-1000 ${curr?.color || 'bg-slate-950'} text-white overflow-hidden text-center text-center`}>
                    <div className="flex justify-between items-start p-4 z-30 relative shrink-0 h-[15vh] text-center text-center text-center text-center">
                        <button onClick={onExit} className="bg-black/20 px-6 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest border border-white/5 active:scale-90 transition-transform italic leading-none flex items-center justify-center text-center text-center text-center text-center">✖ SALIR</button>
                        <div className="flex flex-col items-center text-center text-center text-center">
                            <div className="relative flex items-center justify-center w-[20vh] h-[20vh] mx-auto scale-75 mt-[-2vh] text-center text-center">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--accent)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: sessionPieOffset, transition: 'stroke-dashoffset 1s linear' }} />
                                </svg>
                            </div>
                            <span className="text-[3.5vh] font-black italic neon-text-orange leading-none mt-[-3vh] text-center text-center">{formatTime(totalWorkoutSeconds)}</span>
                        </div>
                    </div>

                    <div className="flex-1 grid grid-cols-3 items-center w-full px-6 landscape:px-12 relative overflow-hidden text-center text-center text-center text-center text-center">
                        
                        {/* IZQUIERDA: RONDAS */}
                        <div className="flex flex-col items-center justify-center h-[55vh] relative text-center mx-auto w-full text-center text-center text-center text-center text-center">
                            <span className="text-[2.5vh] font-black uppercase tracking-[0.4em] text-white/50 mb-4 italic leading-none text-center text-center text-center text-center text-center">RONDAS</span>
                            <div className="relative flex items-center justify-center w-[38vh] h-[38vh] mx-auto text-center text-center text-center text-center text-center text-center text-center">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center text-center text-center text-center text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--neon-cyan)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: roundPieOffset, transition: 'stroke-dashoffset 0.8s ease' }} />
                                </svg>
                            </div>
                            <div className="mt-4 text-center text-center text-center text-center text-center">
                                <span className="text-[10vh] font-black italic leading-none neon-text-cyan tabular-nums text-center text-center text-center text-center text-center">{curr?.tr || 0}</span>
                            </div>
                        </div>

                        {/* CENTRO: TIMER DINÁMICO */}
                        <div className="flex flex-col items-center justify-center h-full relative text-center mx-auto w-full text-center text-center text-center text-center text-center">
                            <div className="absolute top-[0vh] w-full text-center text-center text-center text-center text-center">
                                 <h2 className="text-[5vh] font-black uppercase italic tracking-tighter drop-shadow-2xl leading-none text-white text-center italic text-center text-center text-center text-center">{curr?.bodySection || curr?.phase}</h2>
                            </div>
                            <div className="relative flex items-center justify-center w-[58vh] h-[58vh] mt-[4vh] mx-auto text-center text-center text-center text-center text-center text-center">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center text-center text-center text-center text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--accent)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: timerPieOffset, transition: 'stroke-dashoffset 1s linear' }} />
                                </svg>
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-center text-center text-center text-center text-center text-center">
                                    <span className="text-[20vh] font-black tabular-nums drop-shadow-2xl leading-none neon-text-orange italic text-center text-center text-center text-center text-center">{timeLeft}</span>
                                </div>
                            </div>
                            <div className="mt-[3vh] flex items-center gap-[5vh] mx-auto text-center text-center text-center text-center text-center text-center">
                                <button onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} className="bg-white text-black w-[9vh] h-[9vh] rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition-all text-[4vh] leading-none flex items-center justify-center text-center text-center text-center text-center">
                                    {status === 'running' ? '⏸' : '▶'}
                                </button>
                                <button onClick={() => setTimeLeft(0)} className="bg-white/20 w-[6vh] h-[6vh] rounded-full text-[2.5vh] flex items-center justify-center border border-white/10 active:scale-90 italic leading-none flex items-center justify-center text-center text-center text-center text-center">⏭</button>
                            </div>
                        </div>

                        {/* DERECHA: CICLOS */}
                        <div className="flex flex-col items-center justify-center h-[55vh] relative text-center mx-auto w-full text-center text-center text-center text-center text-center text-center">
                            <span className="text-[2.5vh] font-black uppercase tracking-[0.4em] text-white/50 mb-4 italic leading-none text-center text-center text-center text-center text-center text-center">CICLOS</span>
                            <div className="relative flex items-center justify-center w-[38vh] h-[38vh] mx-auto text-center text-center text-center text-center text-center text-center text-center text-center text-center">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center text-center text-center text-center text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--neon-green)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: cyclePieOffset, transition: 'stroke-dashoffset 0.8s ease' }} />
                                </svg>
                            </div>
                            <div className="mt-4 text-center text-center text-center text-center text-center text-center text-center">
                                <span className="text-[10vh] font-black italic leading-none neon-text-green tabular-nums text-center text-center text-center text-center text-center text-center">{curr?.tc || 0}</span>
                            </div>
                        </div>
                    </div>
                    <div className="h-[3vh] shrink-0 text-center text-center text-center text-center text-center text-center text-center text-center"></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
