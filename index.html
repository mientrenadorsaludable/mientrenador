<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / App Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <title>Mi entrenador Fuerte y saludable | App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        :root {
            --bg-main: #020617;
            --accent: #f97316;
            --neon-cyan: #22d3ee;
            --neon-green: #4ade80;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; background-color: var(--bg-main); }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        :fullscreen { background-color: #020617; }
        :-webkit-full-screen { background-color: #020617; }

        .timer-huge {
            font-size: 60vw; 
            line-height: 0.75;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: #000;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }
        
        @media (orientation: landscape) {
            .timer-huge { font-size: 75vh; }
        }

        .btn-control {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .btn-control:active { transform: scale(0.85); }

        /* Estilo para desplazamiento de gráfica */
        .chart-container-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mientrenador-v3"; 
        const APP_TITLE = "Mi entrenador Fuerte y saludable";
        const APP_VERSION = "21.5.0"; 

        const WARMUP_STEPS = [
            'tobillo derecho', 'tobillo izquierdo', 
            'rodillas a la izquierda', 'rodillas a la derecha', 
            'cintura', 
            'brazo derecho', 'brazo izquierdo', 
            'cuello'
        ];

        const DEFAULT_PARAMS = {
            calentamiento: { action: 30, change: 5, rounds: 8, cycles: 1, rest: 0 },
            entrenamiento: { action: 30, change: 10, rounds: 9, cycles: 4, rest: 60 },
            estiramientos: { action: 30, change: 5, rounds: 17, cycles: 1, rest: 0 }
        };

        const formatTime = (s) => {
            const m = Math.floor(s / 60);
            const secs = s % 60;
            return `${m}:${secs.toString().padStart(2, '0')}`;
        };

        // Formato largo para el total entrenado (Horas y Minutos)
        const formatTotalTimeLong = (totalSeconds) => {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            let parts = [];
            if (hours > 0) parts.push(`${hours}h`);
            if (minutes > 0 || hours > 0) parts.push(`${minutes}m`);
            if (hours === 0 && minutes < 10) parts.push(`${seconds}s`);
            
            return parts.length > 0 ? parts.join(" ") : "0s";
        };

        const timeToWords = (totalSeconds) => {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            let result = "";
            if (hours > 0) {
                result += `${hours} ${hours === 1 ? 'hora' : 'horas'}`;
                if (minutes > 0) result += ` con ${minutes} ${minutes === 1 ? 'minuto' : 'minutos'}`;
            } else {
                if (minutes > 0) {
                    result += `${minutes} ${minutes === 1 ? 'minuto' : 'minutos'}`;
                    if (seconds > 0) result += ` con ${seconds} ${seconds === 1 ? 'segundo' : 'segundos'}`;
                } else {
                    result += `${seconds} ${seconds === 1 ? 'segundo' : 'segundos'}`;
                }
            }
            if (totalSeconds === 0) result = "cero segundos";
            return result;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('workouts'); 
            const [workouts, setWorkouts] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [editingWorkout, setEditingWorkout] = useState(null);

            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'es-ES';
                msg.rate = 1.15;
                window.speechSynthesis.speak(msg);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    setTimeout(() => setLoading(false), 2000);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                const unsubW = pathBase.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = pathBase.collection('history').onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubW(); unsubH(); };
            }, [user]);

            useEffect(() => {
                const handleViewChange = (e) => setView(e.detail);
                window.addEventListener('setView', handleViewChange);
                return () => window.removeEventListener('setView', handleViewChange);
            }, []);

            const startWorkout = async (w) => {
                setSelectedWorkout(w);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                } catch (err) {}
                setView('play');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white text-center">
                    <div className="animate-pulse-slow text-9xl mb-6 text-center mx-auto text-white">🏋️‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase tracking-tighter mb-4 leading-tight text-white">{APP_TITLE}</h1>
                    <div className="mt-4 flex flex-col items-center gap-3 text-white text-center">
                        <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                        <span className="text-slate-600 font-black text-[10px] tracking-[0.5em] uppercase italic text-white text-center">VERSIÓN {APP_VERSION}</span>
                    </div>
                </div>
            );

            if (!user) return <AuthView appId={appId} db={db} auth={auth} />;

            return (
                <div className="h-full w-full flex flex-col relative bg-slate-950 overflow-hidden text-center text-white">
                    {view !== 'play' && (
                        <header className="p-6 flex justify-between items-center bg-slate-900 shrink-0 border-b border-white/5 text-white">
                            <div onClick={() => setView('workouts')} className="cursor-pointer text-white text-left text-center">
                                <h1 className="text-lg font-black italic uppercase leading-none tracking-tight text-white">{APP_TITLE}</h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <p className="text-[9px] font-bold text-slate-500 lowercase italic tracking-wider leading-none">{user.email}</p>
                                    <span className="text-[8px] font-black text-orange-500/50 uppercase leading-none tracking-widest border-l border-white/10 pl-2">V {APP_VERSION}</span>
                                </div>
                            </div>
                            <div className="flex gap-2 leading-none text-white">
                                {user.email?.toLowerCase() === "cumorahnet@gmail.com" && (
                                    <button onClick={() => setView('admin')} className="p-2 bg-slate-800 rounded-xl font-bold text-lg flex items-center justify-center text-white shadow-lg border border-white/5">🛡️</button>
                                )}
                                <button onClick={() => auth.signOut()} className="p-2 bg-red-500/10 rounded-xl text-red-500 font-bold border border-red-500/20 text-lg flex items-center justify-center text-center text-white active:scale-90">🚪</button>
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 overflow-y-auto scrollbar-hide w-full ${view === 'play' ? 'p-0 h-full' : 'p-4 max-w-2xl mx-auto'}`}>
                        {view === 'workouts' && <WorkoutsView workouts={workouts} setWorkout={startWorkout} appId={appId} db={db} user={user} onEdit={(w) => { setEditingWorkout(w); setView('create'); }} onCreate={() => { setEditingWorkout(null); setView('create'); }} />}
                        {view === 'avance' && <AvanceView history={history} />}
                        {view === 'create' && <CreateView onCancel={() => { setView('workouts'); setEditingWorkout(null); }} user={user} appId={appId} db={db} workoutToEdit={editingWorkout} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} speak={speak} onExit={() => {
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts');
                        }} onComplete={(name, time) => {
                            db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() });
                            setView('workouts');
                        }} />}
                        {view === 'admin' && <AdminView onBack={() => setView('workouts')} appId={appId} db={db} />}
                    </main>

                    {view !== 'play' && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/5 p-4 flex justify-around items-center z-50 shadow-2xl text-white">
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[9px] font-black ${view === 'workouts' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center text-white">🏋️</span> MIS RUTINAS
                            </button>
                            <button onClick={() => setView('avance')} className={`flex flex-col items-center text-[9px] font-black ${view === 'avance' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1 text-center text-white">📊</span> AVANCE
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        function AuthView({ appId, db, auth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email.trim(), password);
                    else await auth.signInWithEmailAndPassword(email.trim(), password);
                } catch (err) { alert("Error: " + err.message); }
            };
            return (
                <div className="h-full w-full flex flex-col items-center bg-slate-950 p-10 pt-20 text-white text-center">
                    <div className="text-7xl mb-6 animate-pulse-slow mx-auto text-center text-white text-center">🏃‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase mb-1 tracking-tighter text-white italic text-center text-center">{APP_TITLE}</h1>
                    <p className="text-[8px] font-black text-slate-600 tracking-[0.3em] uppercase mb-8">VERSIÓN {APP_VERSION}</p>
                    <form onSubmit={handleAuth} className="space-y-4 w-full max-w-sm mt-2 text-center text-white text-center">
                        <input type="email" placeholder="EMAIL" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-center text-white text-center text-center text-center" value={email} onChange={e => setEmail(e.target.value)} required />
                        <input type="password" placeholder="CLAVE" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-center text-white text-center text-center text-center text-center" value={password} onChange={e => setPassword(e.target.value)} required />
                        <button type="submit" className="w-full bg-orange-500 py-6 rounded-full font-black uppercase shadow-xl italic text-white text-center text-white text-center">ENTRAR</button>
                    </form>
                    <button onClick={() => setIsRegister(!isRegister)} className="mt-8 text-slate-500 text-[10px] font-black uppercase border-b border-orange-500/30 pb-1 italic text-center text-white text-center">{isRegister ? 'Ya tengo cuenta' : 'Crear cuenta nueva'}</button>
                </div>
            );
        }

        function WorkoutsView({ workouts, setWorkout, appId, db, user, onEdit, onCreate }) {
            return (
                <div className="space-y-4 pb-32 animate-fade-in text-white text-center text-center text-center">
                    {workouts.map(w => (
                        <div key={w.id} className="glass-card p-6 flex justify-between items-center text-left text-white shadow-xl text-center text-center">
                            <div className="flex-1 cursor-pointer truncate text-left text-white text-center" onClick={() => setWorkout(w)}>
                                <h3 className="font-black uppercase italic truncate text-sm text-white text-center">{w.name}</h3>
                                <span className="text-[10px] font-black text-orange-400 uppercase bg-orange-500/10 px-2 py-0.5 rounded-lg">{formatTime(w.totalTime)}</span>
                            </div>
                            <div className="flex gap-2 text-white text-center text-center text-center">
                                <button onClick={() => setWorkout(w)} title="Iniciar" className="bg-white text-black p-4 rounded-xl shadow-xl active:scale-90 text-xl font-black text-center text-center">▶</button>
                                <button onClick={() => onEdit(w)} title="Editar" className="bg-slate-800 text-white p-4 rounded-xl flex items-center justify-center text-xs active:scale-90 text-center">📝</button>
                                <button onClick={() => db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts').doc(w.id).delete()} title="Borrar" className="bg-red-500/10 text-red-500 p-4 rounded-xl flex items-center justify-center text-xs active:scale-90 text-red-500 text-center text-center">🗑️</button>
                            </div>
                        </div>
                    ))}
                    <button onClick={onCreate} className="w-full bg-white/5 border border-white/10 py-6 rounded-full font-black uppercase shadow-xl italic active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 text-white text-center text-center text-center">
                        <span className="text-xl text-center">➕</span> NUEVA RUTINA
                    </button>
                </div>
            );
        }

        function PlayerView({ workout, speak, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const savedRef = useRef(false);
            const lastSpokenKey = useRef(""); 
            const wakeLockRef = useRef(null); 

            // --- Lógica Reforzada de Wake Lock (Pantalla encendida) ---
            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try {
                        if (!wakeLockRef.current) {
                            wakeLockRef.current = await navigator.wakeLock.request('screen');
                            console.log("Protección de pantalla activa.");
                        }
                    } catch (err) {
                        console.error(`${err.name}, ${err.message}`);
                    }
                }
            };

            const releaseWakeLock = async () => {
                if (wakeLockRef.current !== null) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                }
            };

            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (wakeLockRef.current !== null && document.visibilityState === 'visible' && status === 'running') {
                        requestWakeLock();
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, [status]);

            const toggleFullScreen = async () => {
                try {
                    const el = document.documentElement;
                    if (!document.fullscreenElement) {
                        if (el.requestFullscreen) await el.requestFullscreen();
                    } else {
                        if (document.exitFullscreen) await document.exitFullscreen();
                    }
                } catch (err) {}
            };

            const handleRestart = () => {
                setStatus('paused');
                setIdx(0);
                if (steps.length > 0) setTimeLeft(steps[0].seconds);
                setElapsed(0);
                savedRef.current = false;
                speak("Rutina reiniciada");
            };

            const handleStopManually = () => {
                setStatus('finished');
                releaseWakeLock();
                if (!savedRef.current) { 
                    onComplete(workout.name, elapsed); 
                    savedRef.current = true; 
                    speak(`Felicidades, entrenaste ${timeToWords(elapsed)}`);
                }
            };

            const handleNextStep = () => {
                if (idx < steps.length - 1) {
                    const nextIdx = idx + 1;
                    setIdx(nextIdx);
                    setTimeLeft(steps[nextIdx].seconds);
                }
            };

            const handleJumpToStretches = () => {
                const stretchIdx = steps.findIndex(s => s.phaseId === 'estiramientos');
                if (stretchIdx !== -1) {
                    setIdx(stretchIdx);
                    setTimeLeft(steps[stretchIdx].seconds);
                    speak("Entrenamiento parado. Vamos a estirar.");
                }
            };

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                const REGIONS = ['piernas', 'brazos', 'tronco'];

                s.push({ 
                    label: 'PREPÁRATE', 
                    seconds: 15, 
                    color: 'bg-yellow-400', 
                    phaseId: 'inicio', r: 0, tr: 0, cy: 0, tc: 0 
                });

                ['calentamiento', 'entrenamiento', 'estiramientos'].forEach((pId) => {
                    const c = ph[pId];
                    const phaseColor = pId === 'calentamiento' ? 'bg-yellow-400' : pId === 'entrenamiento' ? 'bg-emerald-400' : 'bg-blue-400';
                    
                    for(let cy = 1; cy <= c.cycles; cy++) {
                        for(let r = 1; r <= c.rounds; r++) {
                            let label = pId.toUpperCase();
                            if (pId === 'entrenamiento') label = REGIONS[Math.floor((r-1)/3) % 3].toUpperCase();
                            else if (pId === 'calentamiento') label = WARMUP_STEPS[(r-1) % WARMUP_STEPS.length].toUpperCase();

                            s.push({ 
                                label, seconds: c.action, color: phaseColor, 
                                phaseId: pId, r, tr: c.rounds, cy, tc: c.cycles 
                            });

                            if(r < c.rounds) {
                                s.push({ 
                                    label: 'CAMBIO', seconds: c.change, color: 'bg-yellow-300', 
                                    phaseId: pId, r, tr: c.rounds, cy, tc: c.cycles 
                                });
                            }
                        }
                        if(cy < c.cycles && c.rest > 0) {
                            s.push({ 
                                label: 'DESCANSO', seconds: c.rest, color: 'bg-rose-500', 
                                phaseId: pId, r: 'R', tr: c.rounds, cy, tc: c.cycles 
                            });
                        }
                    }
                });

                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].seconds);
                return () => releaseWakeLock();
            }, [workout]);

            useEffect(() => {
                if (status !== 'running') return;
                
                requestWakeLock();

                const current = steps[idx];
                const next = steps[idx + 1];
                const key = `${idx}_${timeLeft}`;

                if (lastSpokenKey.current === key) return;

                if (idx === 0 && timeLeft === current.seconds) {
                    speak("Prepárate");
                    lastSpokenKey.current = key;
                }

                if (current.label !== 'CAMBIO' && current.label !== 'DESCANSO' && current.label !== 'PREPÁRATE' && timeLeft === current.seconds) {
                    speak("Empieza");
                    lastSpokenKey.current = key;
                }

                if ((current.label === 'CAMBIO' || current.label === 'DESCANSO') && timeLeft === current.seconds) {
                    speak("Cambio");
                    lastSpokenKey.current = key;
                }

                if (timeLeft === 5 && (current.label === 'CAMBIO' || current.label === 'DESCANSO' || current.label === 'PREPÁRATE')) {
                    if (next) {
                        let verb = "calentar";
                        if (next.phaseId === 'entrenamiento') verb = "ejercitar";
                        if (next.phaseId === 'estiramientos') verb = "estirar";
                        const phrase = next.phaseId === 'estiramientos' ? "Cambio" : `Vamos a ${verb} ${next.label.toLowerCase()}`;
                        speak(phrase);
                        lastSpokenKey.current = key;
                    }
                }

                if (timeLeft <= 3 && timeLeft > 0 && lastSpokenKey.current !== key) {
                    speak(timeLeft.toString());
                    lastSpokenKey.current = key;
                }

            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); setTimeLeft(steps[idx+1].seconds); 
                                if('vibrate' in navigator) navigator.vibrate(200); 
                            } else {
                                setStatus('finished');
                                releaseWakeLock();
                                if (!savedRef.current) { 
                                    onComplete(workout.name, elapsed + 1); 
                                    savedRef.current = true; 
                                    speak(`Felicidades, entrenaste ${timeToWords(elapsed + 1)}`);
                                }
                            }
                        }
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps, workout.name, elapsed, onComplete]);

            if (status === 'finished') return (
                <div className="h-screen flex flex-col items-center justify-center p-8 bg-slate-950 text-white italic text-center text-center">
                    <div className="text-9xl mb-10 animate-bounce text-white text-center mx-auto text-center">🏆</div>
                    <h1 className="text-6xl font-black mb-4 uppercase tracking-tighter leading-none text-white text-center text-center">¡LOGRADO!</h1>
                    <div className="glass-card p-10 w-full mb-12 shadow-2xl border-orange-500/20 text-center text-white text-center text-center text-center text-center">
                        <p className="text-[10px] font-black opacity-40 uppercase text-center text-white text-center text-center text-center">Total Entrenamiento</p>
                        <p className="text-7xl font-black text-orange-500 leading-none text-center text-white text-center text-center text-center">{formatTime(elapsed)}</p>
                    </div>
                    <div className="flex flex-col gap-4 w-full max-w-sm text-center text-center text-center text-center text-center">
                        <button onClick={handleRestart} className="w-full bg-orange-500 text-white py-5 rounded-full font-black uppercase shadow-xl italic tracking-widest text-center text-white active:scale-95 transition-transform text-center text-center">VOLVER A EMPEZAR</button>
                        <button onClick={onExit} className="w-full bg-white text-black py-5 rounded-full font-black uppercase shadow-2xl active:scale-95 transition-transform italic tracking-widest text-center text-black text-center text-center text-center">FINALIZAR</button>
                    </div>
                </div>
            );

            const curr = steps[idx];

            return (
                <div className="h-screen w-screen flex flex-col bg-slate-950 overflow-hidden select-none text-center text-white text-center text-center text-center text-center text-center text-center">
                    
                    {/* CABECERA */}
                    <div className="bg-slate-950 p-4 pt-8 flex justify-between items-center text-white shrink-0 border-b border-white/5 text-center text-center text-center text-center text-center">
                        <div className="flex flex-col items-start text-white text-left text-center text-center text-center text-center">
                             <span className="text-[10px] font-black uppercase tracking-widest text-orange-500 leading-none text-center text-center text-center">TIEMPO</span>
                             <span className="text-xl font-black italic leading-none mt-1 text-center text-center text-center">{formatTime(elapsed)}</span>
                        </div>
                        <h2 className="text-xs font-black uppercase italic tracking-widest truncate max-w-[150px] text-white text-center text-center text-center text-center text-center text-center">{workout.name}</h2>
                        <div className="flex gap-2 text-center text-center text-center text-center">
                             <button onClick={toggleFullScreen} title="Pantalla Completa" className="text-white opacity-40 text-xl px-2 text-center text-center">⛶</button>
                             <button onClick={onExit} className="text-white opacity-40 text-xl px-2 text-center text-center">✕</button>
                        </div>
                    </div>

                    {/* TIMER GIGANTE */}
                    <div className={`flex-1 flex flex-col items-center justify-center ${curr?.color || 'bg-yellow-400'} transition-colors duration-500 relative text-center text-center text-center text-center text-center`}>
                        <h2 className="text-[12vw] landscape:text-[10vh] font-black uppercase italic tracking-tighter text-black mb-1 leading-none text-center text-center text-center text-center text-center text-center text-center text-center">
                            {curr?.label || 'LISTO'}
                        </h2>
                        <span className="timer-huge tabular-nums text-center text-center text-center text-center text-center text-center text-center">
                            {timeLeft}
                        </span>
                    </div>

                    {/* ESTADÍSTICAS Y CONTROLES */}
                    <div className="bg-slate-950 p-6 pb-12 flex flex-col items-center shrink-0 text-center text-center text-center text-center text-center text-center text-center">
                        <div className="w-full max-w-md grid grid-cols-3 items-center mb-8 text-center text-center text-center text-center text-center">
                            <div className="flex flex-col items-center text-center text-center text-center text-center text-center text-center">
                                <span className="text-[18vw] landscape:text-[14vh] font-black text-sky-400 leading-none text-center text-center text-center text-center text-center text-center text-center">{curr?.r || 0}</span>
                                <span className="text-[8px] font-black uppercase text-slate-500 tracking-widest mt-1 text-center text-center text-center text-center text-center text-center text-center text-center">RONDAS RESTANT...</span>
                            </div>

                            <div className="flex flex-col items-center gap-4 text-center text-center text-center text-center text-center text-center text-center">
                                <button 
                                    onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} 
                                    className="w-20 h-20 rounded-full border-4 border-yellow-400 flex items-center justify-center bg-transparent active:scale-95 transition-transform text-center text-center text-center text-center text-center text-center"
                                >
                                    <div className="text-yellow-400 text-4xl leading-none text-center text-center text-center text-center text-center text-center">
                                        {status === 'running' ? '❚❚' : '▶'}
                                    </div>
                                </button>
                                <span className="text-[10px] font-black uppercase text-yellow-400/60 tracking-widest leading-none text-center text-center text-center text-center text-center text-center">
                                    {status === 'running' ? 'PAUSAR' : 'EMPEZAR'}
                                </span>
                            </div>

                            <div className="flex flex-col items-center text-center text-center text-center text-center text-center text-center text-center text-center">
                                <span className="text-[18vw] landscape:text-[14vh] font-black text-yellow-400 leading-none text-center text-center text-center text-center text-center text-center text-center text-center text-center text-center text-center">{curr?.cy || 0}</span>
                                <span className="text-[8px] font-black uppercase text-slate-500 tracking-widest mt-1 text-center text-center text-center text-center text-center text-center text-center text-center text-center text-center text-center">CICLOS RESTANTES</span>
                            </div>
                        </div>

                        {/* FILA DE BOTONES SECUNDARIOS */}
                        <div className="w-full max-w-sm flex justify-center items-center gap-6 text-white text-center text-center text-center text-center text-center">
                            <button onClick={handleRestart} title="Reiniciar" className="bg-slate-800 p-4 rounded-full border border-white/10 text-yellow-400 text-xl shadow-xl active:scale-75 text-center text-center text-center text-center text-center">
                                🔄
                            </button>
                            <button onClick={handleStopManually} title="Parar y Guardar" className="bg-red-500/20 p-4 rounded-full border border-red-500/30 active:scale-90 text-red-500 text-xl shadow-lg text-center text-center text-center text-center text-center text-center">
                                ⏹
                            </button>
                            <button onClick={handleJumpToStretches} title="Ir a estirar" className="bg-blue-500/20 p-4 rounded-full border border-blue-500/30 active:scale-90 text-blue-400 text-xl shadow-lg text-center text-center text-center text-center text-center text-center">
                                🧘
                            </button>
                            <button onClick={handleNextStep} title="Siguiente Ejercicio" className="bg-slate-800 p-4 rounded-full border border-white/10 text-white text-xl shadow-xl active:scale-75 text-center text-center text-center text-center text-center text-center text-center">
                                ⏭
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function AvanceView({ history }) {
            const chartRef = useRef(null);
            const totalSeconds = history.reduce((acc, h) => acc + (h.totalTime || 0), 0);

            useEffect(() => {
                const ctx = document.getElementById('advanceChart')?.getContext('2d');
                if (!ctx) return;

                // Generar etiquetas para los últimos 14 días (2 semanas)
                const last14Days = [];
                for (let i = 13; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    last14Days.push(d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }));
                }

                // Agrupar datos reales por fecha
                const dailyData = {};
                history.forEach(h => {
                    const dateStr = new Date(h.date).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' });
                    dailyData[dateStr] = (dailyData[dateStr] || 0) + (h.totalTime || 0);
                });

                // Mapear datos reales a los últimos 14 días (poner 0 si no hay dato)
                const chartData = last14Days.map(dayLabel => Math.floor((dailyData[dayLabel] || 0) / 60));

                if (chartRef.current) chartRef.current.destroy();
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: last14Days,
                        datasets: [{
                            label: 'Minutos',
                            data: chartData,
                            backgroundColor: '#f97316',
                            borderRadius: 8,
                            hoverBackgroundColor: '#22d3ee'
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                grid: { color: 'rgba(255,255,255,0.05)' }, 
                                ticks: { color: '#64748b', font: { size: 10 } } 
                            },
                            x: { 
                                grid: { display: false }, 
                                ticks: { color: '#64748b', font: { size: 9 }, autoSkip: false } 
                            }
                        }
                    }
                });
                return () => chartRef.current?.destroy();
            }, [history]);

            return (
                <div className="space-y-6 animate-fade-in pb-32 text-center text-white text-center text-center">
                    <div className="grid grid-cols-1 gap-4 text-white text-center text-center text-center">
                        {/* PANEL DE TIEMPO TOTAL CONVERTIDO A HORAS/MINUTOS */}
                        <div className="glass-card p-8 flex flex-col items-center text-center text-white text-center text-center">
                            <span className="text-[10px] font-black uppercase opacity-40 mb-2 text-center text-white text-center">TIEMPO TOTAL ENTRENADO</span>
                            <span className="text-4xl font-black text-orange-500 neon-text-orange italic leading-none text-center text-white text-center">
                                {formatTotalTimeLong(totalSeconds)}
                            </span>
                            <span className="text-[8px] font-bold text-slate-600 mt-2 uppercase tracking-widest text-center text-white text-center">Datos desde el inicio</span>
                        </div>

                        {/* GRÁFICA DESPLAZABLE DE 14 DÍAS */}
                        <div className="glass-card p-6 text-white text-center text-center text-center">
                            <span className="text-[10px] font-black uppercase opacity-40 mb-4 block text-center text-center text-white text-center">PROGRESO ÚLTIMAS 2 SEMANAS (MIN)</span>
                            <div className="chart-container-scroll">
                                <div style={{ minWidth: '600px', height: '220px' }}>
                                    <canvas id="advanceChart"></canvas>
                                </div>
                            </div>
                            <p className="text-[8px] text-slate-500 mt-4 italic text-center text-white text-center">Desliza la gráfica para ver los 14 días</p>
                        </div>
                    </div>
                </div>
            );
        }

        function CreateView({ onCancel, user, appId, db, workoutToEdit }) {
            const [name, setName] = useState(workoutToEdit ? workoutToEdit.name : '');
            const [phases, setPhases] = useState(workoutToEdit ? workoutToEdit.phases : DEFAULT_PARAMS);
            const update = (p, f, v) => setPhases(prev => ({...prev, [p]: {...prev[p], [f]: parseInt(v) || 0}}));
            const save = async () => {
                if (!name.trim()) return;
                const path = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts');
                const data = { name, phases, updatedAt: new Date().toISOString() };
                if (workoutToEdit && workoutToEdit.id) await path.doc(workoutToEdit.id).update(data);
                else await path.add({ ...data, createdAt: new Date().toISOString() });
                onCancel();
            };
            return (
                <div className="flex-1 flex flex-col pb-32 animate-in text-white italic text-center text-center text-white text-center text-center text-center">
                    <header className="flex items-center gap-4 py-6 text-center text-white text-center text-white text-center text-center text-center text-center text-center text-center">
                        <button onClick={onCancel} className="p-3 bg-slate-900 rounded-2xl text-center text-white active:scale-90 shadow-lg text-center text-white text-center text-center text-center">⬅</button>
                        <h2 className="text-xl font-black uppercase italic flex-1 text-center text-white text-center text-white text-center text-center text-center text-center text-center text-center">{workoutToEdit ? 'EDITAR' : 'NUEVA'} RUTINA</h2>
                    </header>
                    <div className="space-y-6 text-center text-white px-1 text-center text-white text-center text-center text-center text-center">
                        <input type="text" placeholder="NOMBRE DEL PLAN" className="w-full p-6 bg-slate-900 border border-white/10 rounded-[2rem] font-black text-center uppercase italic focus:border-orange-500 outline-none text-white text-center shadow-inner text-center text-white text-center text-center text-center text-center" value={name} onChange={e => setName(e.target.value)} />
                        {['calentamiento', 'entrenamiento', 'estiramientos'].map((p) => (
                            <div key={p} className="glass-card p-6 italic mb-4 text-center shadow-xl text-center text-white text-center text-center text-center">
                                <span className="font-black uppercase text-xs tracking-widest text-orange-500 border-b border-white/5 block mb-6 pb-2 mx-auto w-fit uppercase text-center text-white text-center">{p}</span>
                                <div className="grid grid-cols-2 gap-4 text-center text-center text-white text-center text-center text-center">
                                    <InputField label="ACCIÓN (S)" val={phases[p].action} set={v => update(p, 'action', v)} />
                                    <InputField label="CAMBIO (S)" val={phases[p].change} set={v => update(p, 'change', v)} />
                                    <InputField label="RONDAS" val={phases[p].rounds} set={v => update(p, 'rounds', v)} />
                                    <InputField label="CICLOS" val={phases[p].cycles} set={v => update(p, 'cycles', v)} />
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-slate-950/95 border-t border-white/5 z-50 text-center text-white text-center text-center text-center text-center">
                        <button onClick={save} className="w-full max-w-sm mx-auto bg-white text-black py-6 rounded-full font-black uppercase shadow-2xl italic tracking-widest active:scale-95 transition-transform text-center text-black text-center text-center text-center">GUARDAR RUTINA</button>
                    </div>
                </div>
            );
        }

        function InputField({ label, val, set }) {
            return (
                <div className="flex flex-col items-center text-center text-center text-white text-center text-center text-center text-center text-center">
                    <span className="text-[8px] font-bold uppercase opacity-40 mb-1 tracking-widest leading-none text-center text-center text-white text-center text-center text-center text-center text-center">{label}</span>
                    <input type="number" className="w-full bg-slate-800/40 border border-white/5 p-4 rounded-xl text-center font-black text-lg outline-none text-center text-center text-white text-center text-center" value={val} onChange={e => set(e.target.value)} />
                </div>
            );
        }

        function AdminView({ onBack, appId, db }) {
            const [users, setUsers] = useState([]);
            useEffect(() => {
                const unsub = db.collection(`artifacts`).doc(appId).collection('public').doc('data').collection('users_metadata').onSnapshot(s => setUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);
            return (
                <div className="animate-fade-in space-y-4 pb-20 p-4 text-center mx-auto w-full max-w-sm flex flex-col items-center text-white italic text-center text-center text-white text-center text-center text-center text-center">
                    <button onClick={onBack} className="p-4 bg-slate-900 rounded-2xl font-black text-xs tracking-widest border border-white/5 mb-6 uppercase text-white text-center text-center text-white text-center text-center text-center text-center">VOLVER AL INICIO</button>
                    <div className="grid gap-3 text-center mx-auto w-full text-center text-center text-white text-center text-center text-center text-center text-center">
                        {users.map(u => (
                            <div key={u.id} className="glass-card p-6 flex justify-between items-center shadow-sm text-center text-center text-white text-center text-center text-center text-center text-center text-center">
                                <div className="truncate text-left pr-4 text-white text-center text-white text-center text-center text-center text-center text-center text-center text-center">
                                    <h4 className="font-bold text-[11px] text-white/90 truncate leading-none mb-1 text-center text-center text-center text-center text-center text-center text-center">{u.email}</h4>
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1 italic text-center text-white text-center text-center text-center text-center text-center text-center text-center text-center">PASS: {u.password}</p>
                                </div>
                                <button onClick={async () => { if(confirm("¿Borrar?")) await db.collection(`artifacts`).doc(appId).collection('public').doc('data').collection('users_metadata').doc(u.id).delete(); }} className="bg-red-500/20 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black border border-red-500/30 uppercase italic hover:bg-red-500 hover:text-white transition-colors text-center text-white text-center text-center text-center text-center text-center">Borrar</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
