<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configuración para App Nativa (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <title>Mi Entrenador | Fuerte y saludable</title>
    
    <!-- Recursos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --accent: #f97316;
            --dark: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--dark); 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(15, 23, 42, 0.05);
            border-radius: 1.5rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-primary:active { transform: scale(0.95); }

        /* Anillo de progreso ultra grueso */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        /* Ocultar cursor en fullscreen si es necesario */
        :fullscreen { background-color: black; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mientrenador-v3";
        const SUPERUSER_EMAIL = "cumorahnet@gmail.com";
        const APP_VERSION = "3.9.0"; 

        const speak = (text) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'es-ES';
            msg.rate = 1.1;
            window.speechSynthesis.speak(msg);
        };

        const formatTime = (s) => `${Math.floor(s / 60)}:${((s || 0) % 60).toString().padStart(2, '0')}`;

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [workouts, setWorkouts] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [editingWorkout, setEditingWorkout] = useState(null);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    setTimeout(() => setLoading(false), 3000);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                const unsubW = pathBase.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = pathBase.collection('history').onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubW(); unsubH(); };
            }, [user]);

            // Función para iniciar entrenamiento con forzado de pantalla completa y rotación
            const startWorkout = async (w) => {
                setSelectedWorkout(w);
                
                try {
                    // 1. Solicitar Pantalla Completa (Oculta barras de navegación/sistema)
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                    
                    // 2. Bloquear Orientación en Horizontal
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e => console.log("Bloqueo no soportado sin app instalada"));
                    }
                } catch (err) {
                    console.log("No se pudo activar modo inmersivo automático.");
                }
                
                setView('play');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white">
                    <div className="relative z-10 flex flex-col items-center animate-fade-in text-center">
                        <div className="text-8xl mb-8 animate-pulse-slow">🏋️‍♂️</div>
                        <h1 className="text-5xl font-black italic uppercase tracking-tighter mb-1">Mi Entrenador</h1>
                        <p className="text-orange-500 font-bold uppercase text-sm tracking-[0.2em] italic mb-10">Fuerte y saludable</p>
                        <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                </div>
            );

            if (!user) return <AuthView appId={appId} db={db} auth={auth} />;

            return (
                <div className="h-full w-full max-w-lg mx-auto flex flex-col relative bg-slate-50 overflow-hidden">
                    {view !== 'play' && (
                        <header className="p-6 flex justify-between items-center bg-white shadow-sm shrink-0">
                            <div>
                                <h1 className="text-xl font-black italic uppercase leading-none">Mi Entrenador</h1>
                                <p className="text-[9px] font-bold text-slate-400 lowercase italic">{user.email}</p>
                            </div>
                            <div className="flex gap-2">
                                {user.email?.toLowerCase() === SUPERUSER_EMAIL.toLowerCase() && (
                                    <button onClick={() => setView('admin')} className="p-2 bg-slate-100 rounded-xl font-bold">🛡️</button>
                                )}
                                <button onClick={() => auth.signOut()} className="p-2 bg-red-50 rounded-xl text-red-500 font-bold">🚪</button>
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 overflow-y-auto scrollbar-hide ${view === 'play' ? 'p-0 h-full w-full max-w-none' : 'p-4 pb-24'}`}>
                        {view === 'dashboard' && <DashboardView history={history} workouts={workouts} onStart={startWorkout} />}
                        {view === 'workouts' && (
                            <WorkoutsView 
                                workouts={workouts} 
                                setWorkout={startWorkout} 
                                onEdit={(w) => { setEditingWorkout(w); setView('create'); }}
                                onCreate={() => { setEditingWorkout(null); setView('create'); }}
                                user={user} appId={appId} db={db} 
                            />
                        )}
                        {view === 'history' && <HistoryListView history={history} user={user} appId={appId} db={db} />}
                        {view === 'create' && <CreateView onCancel={() => { setView('workouts'); setEditingWorkout(null); }} user={user} appId={appId} db={db} workoutToEdit={editingWorkout} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} onExit={() => {
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts');
                        }} onComplete={(name, time) => {
                            db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() });
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('dashboard');
                        }} />}
                        {view === 'admin' && <AdminView onBack={() => setView('dashboard')} appId={appId} db={db} />}
                    </main>

                    {view !== 'play' && (
                        <nav className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-100 p-4 flex justify-around items-center z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center text-[8px] font-bold ${view === 'dashboard' ? 'text-orange-500' : 'text-slate-400'}`}>
                                <span className="text-xl">📊</span> PROGRESO
                            </button>
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[8px] font-bold ${view === 'workouts' ? 'text-orange-500' : 'text-slate-400'}`}>
                                <span className="text-xl">🏋️</span> RUTINAS
                            </button>
                            <button onClick={() => setView('history')} className={`flex flex-col items-center text-[8px] font-bold ${view === 'history' ? 'text-orange-500' : 'text-slate-400'}`}>
                                <span className="text-xl">📜</span> HISTORIAL
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        function AuthView({ appId, db, auth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState(null);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError(null);
                try {
                    let res;
                    if (isRegister) res = await auth.createUserWithEmailAndPassword(email.trim(), password);
                    else res = await auth.signInWithEmailAndPassword(email.trim(), password);
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').doc(res.user.uid).set({
                        email: email.trim(), password, lastActivity: new Date().toISOString()
                    }, { merge: true });
                } catch (err) { setError("Datos incorrectos."); }
            };

            return (
                <div className="h-full flex flex-col justify-center p-10 text-center animate-fade-in bg-white overflow-y-auto">
                    <div className="text-7xl mb-4">🏃‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase leading-none mb-1">MI ENTRENADOR</h1>
                    <p className="text-orange-500 font-bold uppercase text-[9px] tracking-[0.3em] mb-12 italic">Fuerte y Saludable</p>
                    <form onSubmit={handleAuth} className="space-y-4 max-w-sm mx-auto w-full">
                        <input type="email" placeholder="EMAIL" className="w-full p-6 bg-slate-100 rounded-[1.5rem] font-bold outline-none border-2 border-transparent focus:border-orange-500 text-xs lowercase" value={email} onChange={e => setEmail(e.target.value)} required />
                        <div className="relative">
                            <input type={showPass ? "text" : "password"} placeholder="PASSWORD" className="w-full p-6 bg-slate-100 rounded-[1.5rem] font-bold outline-none border-2 border-transparent focus:border-orange-500 text-xs" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-6 top-6 text-xl">{showPass ? '🙈' : '👁️'}</button>
                        </div>
                        <button type="submit" className="w-full btn-primary py-6 rounded-full font-black uppercase shadow-xl tracking-widest italic leading-none">ENTRAR</button>
                    </form>
                    <button onClick={() => setIsRegister(!isRegister)} className="mt-8 text-slate-400 text-[10px] font-black uppercase border-b border-orange-200 pb-1 mx-auto">
                        {isRegister ? 'Ya tengo cuenta' : 'Regístrate gratis'}
                    </button>
                    <p className="mt-10 text-slate-300 font-bold text-[8px] uppercase tracking-widest opacity-50">v{APP_VERSION}</p>
                </div>
            );
        }

        function DashboardView({ history, workouts, onStart }) {
            const chartRef = useRef(null);
            useEffect(() => {
                const ctx = document.getElementById('progressChart')?.getContext('2d');
                if (!ctx) return;
                const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                const dataPoints = Array(7).fill(0);
                history.forEach(h => { dataPoints[new Date(h.date).getDay()] += Math.floor(h.totalTime / 60); });
                if (chartRef.current) chartRef.current.destroy();
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: days, datasets: [{ data: dataPoints, backgroundColor: '#f97316', borderRadius: 6 }] },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { font: { size: 8 } } }, x: { grid: { display: false }, ticks: { font: { size: 8 } } } } }
                });
                return () => chartRef.current?.destroy();
            }, [history]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <section>
                        <h2 className="text-[10px] font-black uppercase text-slate-400 mb-2 italic">Progreso Semanal (Min)</h2>
                        <div className="glass-card p-4 h-56"><canvas id="progressChart"></canvas></div>
                    </section>
                    <section>
                        <h2 className="text-[10px] font-black uppercase text-slate-400 mb-2 italic">Rutinas Recientes</h2>
                        <div className="grid grid-cols-1 gap-3">
                            {workouts.slice(0, 3).map(w => (
                                <div key={w.id} onClick={() => onStart(w)} className="glass-card p-4 flex justify-between items-center cursor-pointer shadow-sm active:scale-95 transition-all">
                                    <h3 className="font-black italic uppercase text-sm">{w.name}</h3>
                                    <span className="text-orange-500">▶</span>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        function WorkoutsView({ workouts, setWorkout, onEdit, onCreate, user, appId, db }) {
            const [deletingId, setDeletingId] = useState(null);
            return (
                <div className="space-y-4 animate-fade-in">
                    <button onClick={onCreate} className="w-full btn-primary py-4 rounded-2xl font-black uppercase shadow-md italic">➕ Nueva Rutina</button>
                    {deletingId && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-[100]">
                            <div className="bg-white p-8 rounded-[2rem] w-full max-w-sm text-center">
                                <h2 className="font-black uppercase italic text-xl mb-2 italic">¿Borrar?</h2>
                                <div className="flex flex-col gap-3 mt-8">
                                    <button onClick={async () => { await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts').doc(deletingId).delete(); setDeletingId(null); }} className="bg-red-500 text-white py-4 rounded-xl font-black uppercase text-xs">ELIMINAR</button>
                                    <button onClick={() => setDeletingId(null)} className="bg-slate-100 py-4 rounded-xl font-black uppercase text-xs">CANCELAR</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-1 gap-3">
                        {workouts.map(w => (
                            <div key={w.id} className="glass-card p-5 flex justify-between items-center">
                                <div className="flex-1 cursor-pointer" onClick={() => setWorkout(w)}>
                                    <h3 className="font-black italic uppercase text-sm">{w.name}</h3>
                                    <p className="text-[8px] font-bold text-slate-400 mt-1 uppercase italic tracking-widest">{formatTime(w.totalTime)} • HIIT</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setWorkout(w)} className="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold text-[10px] italic">GO</button>
                                    <button onClick={() => onEdit(w)} className="bg-slate-100 text-slate-600 p-2 rounded-xl">📝</button>
                                    <button onClick={() => setDeletingId(w.id)} className="bg-red-50 text-red-500 p-2 rounded-xl">🗑️</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CreateView({ onCancel, user, appId, db, workoutToEdit }) {
            const [name, setName] = useState(workoutToEdit ? workoutToEdit.name : '');
            const [phases, setPhases] = useState(workoutToEdit ? workoutToEdit.phases : {
                calentamiento: { prep: 10, action: 30, change: 5, rounds: 1, cycles: 1, rest: 0 },
                entrenamiento: { prep: 0, action: 30, change: 5, rounds: 9, cycles: 4, rest: 60 },
                estiramientos: { prep: 0, action: 20, change: 5, rounds: 4, cycles: 1, rest: 0 }
            });
            const update = (p, f, v) => setPhases(prev => ({...prev, [p]: {...prev[p], [f]: parseInt(v) || 0}}));

            const handleSave = async () => {
                const col = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts');
                if (workoutToEdit) await col.doc(workoutToEdit.id).update({ name, phases, updatedAt: new Date().toISOString() });
                else await col.add({ name, phases, createdAt: new Date().toISOString() });
                onCancel();
            };

            return (
                <div className="flex-1 flex flex-col pb-24 animate-fade-in">
                    <header className="flex items-center gap-4 py-4 mb-4">
                        <button onClick={onCancel} className="p-3 bg-slate-100 rounded-2xl font-bold">⬅</button>
                        <h2 className="text-xl font-black uppercase italic leading-none italic">{workoutToEdit ? 'Editar' : 'Nueva Rutina'}</h2>
                    </header>
                    <div className="space-y-6 overflow-y-auto pr-1 scrollbar-hide">
                        <input type="text" placeholder="NOMBRE" className="w-full p-5 bg-white border-2 border-slate-100 rounded-[1.5rem] font-bold outline-none focus:border-orange-500 uppercase italic" value={name} onChange={e => setName(e.target.value)} />
                        {['calentamiento', 'entrenamiento', 'estiramientos'].map((p) => (
                            <div key={p} className="glass-card p-6 italic mb-4">
                                <span className="font-black uppercase text-sm border-b border-slate-100 block mb-4 pb-2">{p}</span>
                                <div className="grid grid-cols-2 gap-4">
                                    <InputField label="Acción (s)" val={phases[p].action} set={v => update(p, 'action', v)} />
                                    <InputField label="Cambio (s)" val={phases[p].change} set={v => update(p, 'change', v)} />
                                    <InputField label="Rondas" val={phases[p].rounds} set={v => update(p, 'rounds', v)} />
                                    <InputField label="Ciclos" val={phases[p].cycles} set={v => update(p, 'cycles', v)} />
                                    <InputField label="Descanso (s)" val={phases[p].rest} set={v => update(p, 'rest', v)} />
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-slate-50 border-t border-slate-200 z-50">
                        <button onClick={handleSave} className="w-full btn-primary py-5 rounded-full font-black uppercase shadow-lg italic tracking-widest leading-none">GUARDAR</button>
                    </div>
                </div>
            );
        }

        function InputField({ label, val, set }) {
            return (
                <div className="flex flex-col gap-1">
                    <span className="text-[8px] font-bold uppercase opacity-40 leading-none italic">{label}</span>
                    <input type="number" className="w-full bg-slate-50 p-3 rounded-xl text-center font-black text-sm outline-none" value={val} onChange={e => set(e.target.value)} />
                </div>
            );
        }

        function HistoryListView({ history, user, appId, db }) {
            return (
                <div className="space-y-4 animate-fade-in">
                    <h2 className="text-[10px] font-black uppercase text-slate-400 mb-2 italic leading-none">Historial de Sesiones</h2>
                    {history.sort((a,b) => new Date(b.date) - new Date(a.date)).map(h => (
                        <div key={h.id} className="glass-card p-4 flex justify-between items-center">
                            <div className="flex-1 pr-4">
                                <h3 className="font-black uppercase italic text-xs text-slate-700 italic leading-none">{h.workoutName}</h3>
                                <p className="text-[8px] font-bold text-slate-400 mt-1 leading-none">{new Date(h.date).toLocaleDateString()} • {formatTime(h.totalTime)}</p>
                            </div>
                            <button onClick={() => db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').doc(h.id).delete()} className="text-slate-300 p-2 leading-none">✕</button>
                        </div>
                    ))}
                </div>
            );
        }

        function PlayerView({ workout, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const wakeLockRef = useRef(null);

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                const REGIONS = ['Piernas', 'Brazos', 'Tronco'];

                // CALENTAMIENTO
                if (ph.calentamiento.prep > 0) s.push({ label: 'Prepárate', sec: ph.calentamiento.prep, color: 'bg-yellow-500', voice: 'Prepárate', phase: 'Calentamiento' });
                for(let r=1; r<=ph.calentamiento.rounds; r++) {
                    s.push({ label: 'CALIENTA', sec: ph.calentamiento.action, color: 'bg-emerald-600', voice: 'Calienta', phase: 'Calentamiento', r, tr: ph.calentamiento.rounds, cy: 1, tc: 1 });
                    if(r < ph.calentamiento.rounds) s.push({ label: 'Cambio', sec: ph.calentamiento.change, color: 'bg-yellow-500', voice: 'Cambio', phase: 'Calentamiento' });
                }

                s.push({ label: 'Cambio de Fase', sec: 5, color: 'bg-yellow-500', voice: 'Prepárate para entrenar', phase: 'Transición' });

                // ENTRENAMIENTO
                for(let cy=1; cy<=ph.entrenamiento.cycles; cy++) {
                    for(let r=1; r<=ph.entrenamiento.rounds; r++) {
                        const regionIdx = Math.floor((r - 1) / 3) % 3;
                        const regionName = REGIONS[regionIdx];
                        const isFirst = (r - 1) % 3 === 0;
                        s.push({ 
                            label: regionName.toUpperCase(), 
                            sec: ph.entrenamiento.action, 
                            color: 'bg-emerald-600', 
                            voice: isFirst ? `Entrena ${regionName}` : 'Entrena',
                            phase: 'Entrenamiento',
                            r, tr: ph.entrenamiento.rounds, cy, tc: ph.entrenamiento.cycles
                        });
                        if(r < ph.entrenamiento.rounds) s.push({ label: 'CAMBIO', sec: ph.entrenamiento.change, color: 'bg-yellow-500', voice: 'Cambio', phase: 'Entrenamiento' });
                    }
                    if(cy < ph.entrenamiento.cycles) s.push({ label: 'DESCANSO', sec: ph.entrenamiento.rest, color: 'bg-red-600', voice: 'Descanso', phase: 'Entrenamiento' });
                }

                s.push({ label: 'Cambio de Fase', sec: 5, color: 'bg-yellow-500', voice: 'Prepárate para estirar', phase: 'Transición' });

                // ESTIRAMIENTOS
                for(let r=1; r<=ph.estiramientos.rounds; r++) {
                    s.push({ label: 'ESTIRA', sec: ph.estiramientos.action, color: 'bg-emerald-600', voice: 'Estira', phase: 'Estiramiento', r, tr: ph.estiramientos.rounds, cy: 1, tc: 1 });
                    if(r < ph.estiramientos.rounds) s.push({ label: 'Cambio', sec: ph.estiramientos.change, color: 'bg-yellow-500', voice: 'Cambio', phase: 'Estiramiento' });
                }

                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].sec);
            }, [workout]);

            useEffect(() => {
                if (status !== 'running') return;
                const current = steps[idx];
                if (timeLeft === current?.sec) speak(current.voice);
                if (timeLeft <= 3 && timeLeft > 0) speak(timeLeft.toString());
            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(lock => wakeLockRef.current = lock).catch(e => {});
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); 
                                setTimeLeft(steps[idx+1].sec); 
                                if('vibrate' in navigator) navigator.vibrate(200); 
                            }
                            else { setStatus('finished'); wakeLockRef.current?.release().catch(e => {}); }
                        }
                    }, 1000);
                } else { wakeLockRef.current?.release().catch(e => {}); }
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps]);

            if (status === 'finished') return (
                <div className="h-full w-full flex flex-col items-center justify-center p-8 text-center bg-white overflow-hidden">
                    <div className="text-8xl mb-4 animate-bounce">🏆</div>
                    <h2 className="text-4xl font-black uppercase italic leading-none text-center">¡LOGRADO!</h2>
                    <p className="text-7xl font-black text-orange-500 my-10 italic leading-none">{formatTime(elapsed)}</p>
                    <button onClick={() => onComplete(workout.name, elapsed)} className="w-full btn-primary py-8 rounded-full font-black uppercase shadow-lg italic tracking-widest max-w-md">FINALIZAR</button>
                </div>
            );

            const curr = steps[idx];
            const circ = 2 * Math.PI * 42; 
            const offset = circ - ((curr?.sec - timeLeft) / curr?.sec) * circ;

            return (
                <div className={`h-screen w-screen flex flex-col transition-colors duration-500 ${curr?.color || 'bg-slate-900'} text-white overflow-hidden p-4`}>
                    {/* Header Minimalista - Oculto en horizontal para ganar espacio */}
                    <div className="flex justify-between items-center mb-2 z-20">
                        <button onClick={onExit} className="bg-black/20 px-6 py-2 rounded-xl font-black text-xs uppercase tracking-widest italic">✖ SALIR</button>
                        <div className="text-right">
                             <div className="bg-white/20 px-3 py-1 rounded-full text-[10px] font-black backdrop-blur-md flex items-center gap-1">
                                ⏱️ {formatTime(elapsed)}
                             </div>
                        </div>
                    </div>

                    {/* MODO HORIZONTAL (LANDSCAPE) - CONTENEDOR MAESTRO */}
                    <div className="flex-1 flex flex-col items-center justify-center relative">
                        
                        {/* LEYENDA SUPERIOR (Región/Fase) */}
                        <div className="mb-4 text-center z-20">
                             <h3 className="text-[12px] uppercase tracking-[0.5em] font-black opacity-60 mb-1 italic">{curr?.phase}</h3>
                             <h2 className="text-4xl font-black uppercase italic tracking-tighter drop-shadow-lg">{curr?.label}</h2>
                        </div>

                        {/* FILA CENTRAL: RONDAS - TIMER - CICLOS */}
                        <div className="flex items-center justify-center gap-10 w-full px-10">
                            
                            {/* LADO IZQUIERDO: RONDAS */}
                            <div className="flex flex-col items-center justify-center bg-black/25 p-5 rounded-[2rem] min-w-[120px] backdrop-blur-md border border-white/5">
                                <span className="text-[10px] font-black uppercase tracking-widest opacity-40 mb-1 italic">RONDAS</span>
                                <div className="text-4xl font-black italic">{curr?.r || 1}<span className="text-lg opacity-30 mx-1">/</span>{curr?.tr || 1}</div>
                                <span className="text-[8px] font-bold opacity-30 mt-1 uppercase italic">Faltan: {(curr?.tr || 1) - (curr?.r || 1)}</span>
                            </div>

                            {/* CENTRO: TIMER PRINCIPAL */}
                            <div className="relative flex items-center justify-center w-[38vh] h-[38vh]">
                                <svg className="absolute w-full h-full" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.15)" strokeWidth="12" fill="none" />
                                    <circle cx="50" cy="50" r="42" stroke="white" strokeWidth="12" fill="none" className="progress-ring__circle" style={{ strokeDasharray: circ, strokeDashoffset: offset }} />
                                </svg>
                                <div className="text-[11vh] font-black tabular-nums drop-shadow-2xl italic z-10 leading-none">
                                    {timeLeft}
                                </div>
                            </div>

                            {/* LADO DERECHO: CICLOS */}
                            <div className="flex flex-col items-center justify-center bg-black/25 p-5 rounded-[2rem] min-w-[120px] backdrop-blur-md border border-white/5">
                                <span className="text-[10px] font-black uppercase tracking-widest opacity-40 mb-1 italic">CICLOS</span>
                                <div className="text-4xl font-black italic">{curr?.cy || 1}<span className="text-lg opacity-30 mx-1">/</span>{curr?.tc || 1}</div>
                                <span className="text-[8px] font-bold opacity-30 mt-1 uppercase italic">Faltan: {(curr?.tc || 1) - (curr?.cy || 1)}</span>
                            </div>
                        </div>

                        {/* CONTROLES INFERIORES */}
                        <div className="mt-6 flex justify-center gap-10 items-center z-20">
                            <button onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} className="bg-white text-black w-20 h-20 rounded-full flex items-center justify-center shadow-2xl transition-all active:scale-90">
                                {status === 'running' ? '⏸' : '▶'}
                            </button>
                            <button onClick={() => setTimeLeft(0)} className="bg-white/20 w-14 h-14 rounded-full text-xl flex items-center justify-center active:scale-90">⏭</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminView({ onBack, appId, db }) {
            const [users, setUsers] = useState([]);
            useEffect(() => {
                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').onSnapshot(s => setUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);
            return (
                <div className="animate-fade-in space-y-4">
                    <button onClick={onBack} className="p-3 bg-slate-100 rounded-xl font-bold text-xs mb-4">⬅ VOLVER</button>
                    {users.map(u => (
                        <div key={u.id} className="glass-card p-5 flex justify-between items-center shadow-sm mb-2">
                            <div className="truncate text-left pr-4"><h4 className="font-bold text-[10px]">{u.email}</h4><p className="text-[8px] text-slate-400">CLAVE: {u.password}</p></div>
                            <button onClick={async () => { if(confirm("¿Eliminar?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users_metadata').doc(u.id).delete(); }} className="bg-red-50 text-red-500 px-3 py-1 rounded-lg text-[10px] font-black">LIMPIAR</button>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
