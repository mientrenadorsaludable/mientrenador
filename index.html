<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / App Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <title>Mi entrenador Fuerte y saludable | App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --bg-main: #020617;
            --accent: #f97316;
            --neon-cyan: #22d3ee;
            --neon-green: #4ade80;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
        }

        /* --- MOTOR DE ANIMACIÓN ANATÓMICA 2.5 --- */
        
        /* Squat (Sentadilla) */
        @keyframes human-squat-main {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(38px); }
        }
        @keyframes human-thigh-bend {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-65deg); }
        }
        @keyframes human-shin-bend {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(70deg); }
        }

        /* Pushup (Flexión) */
        @keyframes human-pushup-main {
            0%, 100% { transform: rotate(-15deg) translateY(0); }
            50% { transform: rotate(-6deg) translateY(22px); }
        }
        @keyframes human-arm-flex {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-75deg); }
        }

        .anim-group-squat { animation: human-squat-main 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .anim-thigh { animation: human-thigh-bend 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: top center; }
        .anim-shin { animation: human-shin-bend 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: top center; }

        .anim-group-pushup { animation: human-pushup-main 1.3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .anim-arm { animation: human-arm-flex 1.3s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: top center; }

        .anim-pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.05); filter: brightness(1.2); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .neon-text-orange { text-shadow: 0 0 30px rgba(249, 115, 22, 0.8); }
        .neon-text-cyan { text-shadow: 0 0 30px rgba(34, 211, 238, 0.8); }
        
        svg { overflow: visible !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 1. GLOBALES (CON VAR PARA DISPONIBILIDAD TOTAL) ---
        var firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var auth = firebase.auth();
        var db = firebase.firestore();
        var globalAppId = "mientrenador-v3";
        var APP_TITLE = "Mi entrenador Fuerte y saludable";
        var APP_VERSION = "12.5.0";

        var EXERCISE_CATALOG = {
            piernas: [
                { name: 'Sentadillas', type: 'squat' },
                { name: 'Desplantes', type: 'squat' },
                { name: 'Puente Glúteo', type: 'pulse' },
                { name: 'Zancadas', type: 'squat' },
                { name: 'Elevación Talón', type: 'squat' },
                { name: 'Sentadilla Sumo', type: 'squat' }
            ],
            brazos: [
                { name: 'Flexiones', type: 'pushup' },
                { name: 'Fondos Tríceps', type: 'pushup' },
                { name: 'Curl Bíceps', type: 'pulse' },
                { name: 'Press Hombros', type: 'pulse' },
                { name: 'Escaladores', type: 'pushup' },
                { name: 'Burpees', type: 'squat' }
            ],
            tronco: [
                { name: 'Abdominales', type: 'pulse' },
                { name: 'Plancha Fija', type: 'pushup' },
                { name: 'Crunch', type: 'pulse' },
                { name: 'Elevación Piernas', type: 'pulse' },
                { name: 'Supermán', type: 'pulse' },
                { name: 'Giro Ruso', type: 'pulse' }
            ]
        };

        var WARMUP_STEPS = ['tobillo derecho', 'tobillo izquierdo', 'rodilla derecha', 'rodilla izquierda', 'cintura', 'brazo derecho', 'brazo izquierdo', 'cabeza'];

        var DEFAULT_PARAMS = {
            calentamiento: { action: 30, change: 5, rounds: 8, cycles: 1, rest: 0 },
            entrenamiento: { action: 30, change: 10, rounds: 9, cycles: 4, rest: 60 },
            estiramientos: { action: 30, change: 5, rounds: 15, cycles: 1, rest: 0 }
        };

        // --- 2. UTILIDADES ---
        const speak = (text) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'es-ES';
            msg.rate = 1.1;
            window.speechSynthesis.speak(msg);
        };

        const formatTime = (s) => `${Math.floor(s / 60)}:${((s || 0) % 60).toString().padStart(2, '0')}`;

        // --- 3. COMPONENTE DE MANIQUÍ DINÁMICO ---
        const AnatomicalTrainer = ({ type, className = "w-32 h-32" }) => {
            const isSquat = type === 'squat';
            const isPushup = type === 'pushup';
            
            return (
                <div className={`flex items-center justify-center ${(!isSquat && !isPushup) ? 'anim-pulse-soft' : ''}`}>
                    <svg viewBox="0 0 100 130" className={className} xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style={{stopColor: 'var(--accent)', stopOpacity: 1}} />
                                <stop offset="100%" style={{stopColor: '#fb923c', stopOpacity: 1}} />
                            </linearGradient>
                        </defs>
                        
                        <g className={isSquat ? 'anim-group-squat' : isPushup ? 'anim-group-pushup' : ''}>
                            {/* Cabeza */}
                            <circle cx="50" cy="18" r="8" fill="url(#bodyGrad)" />
                            {/* Torso */}
                            <path d="M42 28h16l3 25h-22z" fill="url(#bodyGrad)" />
                            
                            {/* Brazos Articulados */}
                            <g className={isPushup ? 'anim-arm' : ''}>
                                <path d="M42 30l-15 15" stroke="url(#bodyGrad)" strokeWidth="8" strokeLinecap="round" />
                                <path d="M27 45l-5 18" stroke="url(#bodyGrad)" strokeWidth="8" strokeLinecap="round" />
                            </g>
                            <g className={isPushup ? 'anim-arm' : ''}>
                                <path d="M58 30l15 15" stroke="url(#bodyGrad)" strokeWidth="8" strokeLinecap="round" />
                                <path d="M73 45l5 18" stroke="url(#bodyGrad)" strokeWidth="8" strokeLinecap="round" />
                            </g>

                            {/* Piernas con Cinemática Humana */}
                            <g transform="translate(44, 53)">
                                <g className={isSquat ? 'anim-thigh' : ''}>
                                    <path d="M0 0l-10 25" stroke="url(#bodyGrad)" strokeWidth="9" strokeLinecap="round" />
                                    <g transform="translate(-10, 25)" className={isSquat ? 'anim-shin' : ''}>
                                        <path d="M0 0l6 25" stroke="url(#bodyGrad)" strokeWidth="9" strokeLinecap="round" />
                                    </g>
                                </g>
                            </g>
                            <g transform="translate(56, 53)">
                                <g className={isSquat ? 'anim-thigh' : ''}>
                                    <path d="M0 0l10 25" stroke="url(#bodyGrad)" strokeWidth="9" strokeLinecap="round" />
                                    <g transform="translate(10, 25)" className={isSquat ? 'anim-shin' : ''}>
                                        <path d="M0 0l-6 25" stroke="url(#bodyGrad)" strokeWidth="9" strokeLinecap="round" />
                                    </g>
                                </g>
                            </g>
                        </g>
                    </svg>
                </div>
            );
        };

        // --- 4. VISTAS ---

        function ExerciseSelectionView({ onSave }) {
            const [selected, setSelected] = useState({ piernas: [], brazos: [], tronco: [] });
            const toggle = (sec, item) => {
                setSelected(prev => {
                    const list = prev[sec] || [];
                    if (list.some(i => i.name === item.name)) return { ...prev, [sec]: list.filter(i => i.name !== item.name) };
                    if (list.length >= 3) return prev;
                    return { ...prev, [sec]: [...list, item] };
                });
            };
            const ready = selected.piernas.length === 3 && selected.brazos.length === 3 && selected.tronco.length === 3;

            return (
                <div className="h-full w-full bg-slate-950 flex flex-col p-6 overflow-y-auto scrollbar-hide text-white pb-40 text-center">
                    <h2 className="text-4xl font-black italic uppercase text-orange-500 mb-2 tracking-tighter">PREPARAR SESIÓN</h2>
                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-10 italic">ELIGE 3 MOVIMIENTOS POR ZONA</p>
                    {Object.entries(EXERCISE_CATALOG).map(([sec, items]) => (
                        <div key={sec} className="mb-12">
                            <h3 className="text-sm font-black uppercase italic tracking-[0.4em] mb-6 border-b border-white/10 pb-2 inline-block mx-auto text-white">{sec} ({selected[sec].length}/3)</h3>
                            <div className="grid grid-cols-2 gap-3 px-2">
                                {items.map(item => {
                                    const isSel = selected[sec].some(i => i.name === item.name);
                                    return (
                                        <button key={item.name} onClick={() => toggle(sec, item)} className={`p-6 rounded-[2rem] flex flex-col items-center gap-4 transition-all border ${isSel ? "bg-orange-500 border-orange-400 shadow-xl scale-105" : "bg-white/5 border-white/5 opacity-40"}`}>
                                            <AnatomicalTrainer type={item.type} className="w-14 h-14" />
                                            <span className="text-[10px] font-black uppercase italic text-white">{item.name}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                    <div className="fixed bottom-0 left-0 right-0 p-8 bg-slate-950/95 backdrop-blur-xl border-t border-white/10 z-50">
                        <button disabled={!ready} onClick={() => onSave(selected)} className={`w-full py-6 rounded-full font-black uppercase italic tracking-widest shadow-2xl transition-all ${ready ? "bg-white text-black" : "bg-slate-800 text-slate-600 opacity-50"}`}>
                            {ready ? "COMENZAR ENTRENAMIENTO" : "ELIGE 9 EJERCICIOS"}
                        </button>
                    </div>
                </div>
            );
        }

        function PlayerView({ workout, exercises, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const savedRef = useRef(false);

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                const REGIONS = ['Piernas', 'Brazos', 'Tronco'];

                s.push({ label: 'PREPARACIÓN', sec: 30, color: 'bg-slate-800', voice: 'Prepárate', phase: 'Inicio', bodySection: 'LISTO', currentExercise: { name: 'Respira', type: 'pulse' } });

                ['calentamiento', 'entrenamiento', 'estiramientos'].forEach((phaseId) => {
                    const c = ph[phaseId];
                    for(let cy=1; cy<=c.cycles; cy++) {
                        for(let r=1; r<=c.rounds; r++) {
                            let curEx = { name: "" };
                            let nexEx = { name: "" };
                            let voiceMsg = "";
                            
                            if (phaseId === 'calentamiento') {
                                curEx = { name: WARMUP_STEPS[(r-1) % WARMUP_STEPS.length], type: 'pulse' };
                                voiceMsg = "Calienta " + curEx.name;
                            } else if (phaseId === 'entrenamiento') {
                                const sectionIdx = Math.floor((r - 1) / 3) % 3;
                                const exIdx = (r - 1) % 3;
                                const list = exercises[REGIONS[sectionIdx].toLowerCase()] || [];
                                curEx = list[exIdx] || { name: "Ejercicio", type: 'squat' };
                                nexEx = list[(exIdx + 1) % 3] || { name: "Siguiente" };
                                voiceMsg = "Ejercita " + curEx.name;
                            } else {
                                curEx = { name: "Estiramiento", type: 'pulse' };
                                voiceMsg = "Estira";
                            }

                            s.push({ label: phaseId.toUpperCase(), sec: c.action, color: 'bg-emerald-600', voice: voiceMsg, phase: phaseId, r, tr: c.rounds, cy, tc: c.cycles, bodySection: (phaseId === 'entrenamiento' ? REGIONS[Math.floor((r-1)/3)%3].toUpperCase() : phaseId.toUpperCase()), currentExercise: curEx, nextExercise: nexEx });
                            
                            if(r < c.rounds) {
                                s.push({ label: 'CAMBIO', sec: c.change, color: 'bg-yellow-500', voice: 'Cambio', phase: phaseId, r, tr: c.rounds, cy, tc: c.cycles, bodySection: 'CAMBIO', currentExercise: { name: 'Cambio', type: 'pulse' } });
                            }
                        }
                    }
                });
                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].sec);
            }, [workout, exercises]);

            useEffect(() => {
                if (status !== 'running') return;
                const current = steps[idx];
                if (timeLeft === current?.sec) speak(current.voice);
                if (timeLeft <= 3 && timeLeft > 0) speak(timeLeft.toString());
            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); setTimeLeft(steps[idx+1].sec); 
                            } else {
                                speak("ejercicio terminado, lo lograste");
                                setStatus('finished');
                                if (!savedRef.current) { onComplete(workout.name, elapsed + 1); savedRef.current = true; }
                            }
                        }
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps, workout, elapsed, onComplete]);

            const curr = steps[idx];
            const pieCirc = 2 * Math.PI * 20;
            const roundPercentage = curr?.tr ? (Math.min(1, (parseInt(curr.r) || 0) / curr.tr)) : 0;
            const timerPercentage = curr?.sec ? (Math.min(1, (curr.sec - timeLeft) / curr.sec)) : 0;

            if (status === 'finished') return (
                <div className="h-full w-full flex flex-col items-center justify-center p-8 bg-slate-950 text-white italic text-center">
                    <div className="text-9xl mb-10 animate-bounce text-center">🏆</div>
                    <h1 className="text-6xl font-black mb-4 uppercase tracking-tighter">¡LOGRADO!</h1>
                    <div className="glass-card p-10 w-full mb-12 shadow-2xl border-orange-500/20 text-center">
                        <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest italic mb-2 text-center text-center">TIEMPO TOTAL</p>
                        <p className="text-7xl font-black text-orange-500 leading-none">{formatTime(elapsed)}</p>
                    </div>
                    <button onClick={onExit} className="w-full bg-white text-black py-8 rounded-full font-black uppercase shadow-2xl active:scale-95 transition-all text-center">FINALIZAR</button>
                </div>
            );

            return (
                <div className={`h-screen w-screen flex flex-col transition-colors duration-1000 ${curr?.color || 'bg-slate-950'} text-white overflow-hidden text-center`}>
                    <div className="flex justify-between items-start p-6 z-30 relative h-[15vh]">
                        <button onClick={onExit} className="bg-black/20 px-6 py-3 rounded-xl font-black text-[10px] uppercase border border-white/5 active:scale-90 italic text-center">✖ SALIR</button>
                        <div className="flex flex-col items-center">
                            <div className="relative flex items-center justify-center w-[16vh] h-[16vh] scale-75 mt-[-2vh]">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--accent)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: pieCirc - ( (elapsed / steps.reduce((a,b)=>a+b.sec,0)) * pieCirc), transition: 'stroke-dashoffset 1s linear' }} />
                                </svg>
                            </div>
                            <span className="text-[2.5vh] font-black italic neon-text-orange leading-none mt-[-2vh]">{formatTime(elapsed)}</span>
                        </div>
                    </div>

                    <div className="flex-1 grid grid-cols-3 items-center w-full px-12 relative text-center">
                        <div className="flex flex-col items-center justify-center h-[55vh] relative text-center">
                            <span className="text-[1.8vh] font-black uppercase tracking-[0.4em] text-white/50 mb-4 italic text-center">RONDAS</span>
                            <div className="relative flex items-center justify-center w-[38vh] h-[38vh] mx-auto text-center">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--neon-cyan)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: pieCirc - (roundPercentage * pieCirc), transition: 'stroke-dashoffset 0.8s ease' }} />
                                </svg>
                            </div>
                            <div className="mt-4"><span className="text-[10vh] font-black italic leading-none neon-text-cyan tabular-nums">{curr?.r || 0}</span></div>
                        </div>

                        <div className="flex flex-col items-center justify-center h-full relative">
                            <div className="absolute top-[0vh] w-full flex flex-col items-center px-4">
                                 <div className="flex items-center gap-6 text-white/40 font-black uppercase italic leading-none max-w-full">
                                    <span className="text-[1.8vh] truncate max-w-[10vh]">{curr?.currentExercise?.name}</span>
                                    <h2 className="text-[6vh] text-white drop-shadow-2xl">{curr?.bodySection || curr?.phase}</h2>
                                    <span className="text-[1.8vh] truncate max-w-[10vh]">{curr?.nextExercise?.name}</span>
                                 </div>
                            </div>
                            <div className="relative flex items-center justify-center w-[65vh] h-[65vh] mt-[4vh] mx-auto">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--accent)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: pieCirc - (timerPercentage * pieCirc), transition: 'stroke-dashoffset 1s linear' }} />
                                </svg>
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                                    <div className="mb-[-2vh]">
                                        <AnatomicalTrainer type={curr?.currentExercise?.type} className="w-[30vh] h-[30vh]" />
                                    </div>
                                    <span className="text-[25vh] font-black tabular-nums drop-shadow-2xl leading-none neon-text-orange italic">{timeLeft}</span>
                                </div>
                            </div>
                            <div className="mt-[3vh] flex items-center gap-10">
                                <button onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} className="bg-white text-black w-[9vh] h-[9vh] rounded-full flex items-center justify-center shadow-2xl text-[4vh] text-center text-center">
                                    {status === 'running' ? '⏸' : '▶'}
                                </button>
                                <button onClick={() => { if (idx < steps.length - 1) { setIdx(i => i + 1); setTimeLeft(steps[idx+1].sec); } }} className="bg-white/20 w-[6vh] h-[6vh] rounded-full text-[2.5vh] flex items-center justify-center border border-white/10 active:scale-90 italic text-center">⏭</button>
                            </div>
                        </div>

                        <div className="flex flex-col items-center justify-center h-[55vh] relative text-center text-center">
                            <span className="text-[1.8vh] font-black uppercase tracking-[0.4em] text-white/50 mb-4 italic text-center">CICLOS</span>
                            <div className="relative flex items-center justify-center w-[40vh] h-[40vh] mx-auto text-center">
                                <svg className="absolute w-full h-full transform -rotate-90 text-center" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="20" className="pie-background" strokeWidth="40" fill="none" />
                                    <circle cx="50" cy="50" r="20" stroke="var(--neon-green)" strokeWidth="40" fill="none" style={{ strokeDasharray: pieCirc, strokeDashoffset: pieCirc - (0.8 * pieCirc), transition: 'stroke-dashoffset 0.8s ease' }} />
                                </svg>
                            </div>
                            <div className="mt-4 text-center text-center"><span className="text-[10vh] font-black italic leading-none neon-text-green tabular-nums text-center">{curr?.cy || 1}</span></div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTES UI ADICIONALES ---

        function WorkoutsView({ workouts, onStart, onCreate, onDelete }) {
            return (
                <div className="space-y-4 animate-fade-in pb-32 text-white p-6 max-w-lg mx-auto text-center">
                    <header className="flex justify-between items-center mb-10 text-center">
                        <h1 className="text-3xl font-black italic uppercase tracking-tighter leading-none text-white">{APP_TITLE}</h1>
                        <button onClick={() => auth.signOut()} className="bg-slate-900 p-4 rounded-2xl border border-white/5 text-red-500 text-center text-center">🚪</button>
                    </header>
                    {workouts.map(w => (
                        <div key={w.id} className="glass-card p-6 flex justify-between items-center text-center">
                            <div className="flex-1 cursor-pointer truncate text-left" onClick={() => onStart(w)}>
                                <h3 className="font-black uppercase italic text-md truncate text-white">{w.name}</h3>
                                <span className="text-[10px] font-black text-orange-500 uppercase tracking-widest block mt-1 italic text-center">PLAN DE ENTRENAMIENTO</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => onStart(w)} className="bg-white text-black px-6 py-4 rounded-2xl font-black text-[10px] italic text-center">GO</button>
                                <button onClick={() => onDelete(w.id)} className="bg-red-500/10 text-red-500 p-4 rounded-2xl text-center">🗑️</button>
                            </div>
                        </div>
                    ))}
                    <button onClick={onCreate} className="w-full bg-white/5 border border-white/10 py-6 rounded-full font-black uppercase shadow-xl active:scale-95 flex items-center justify-center gap-2 mt-4 text-white text-center">
                        <span className="text-xl">➕</span> NUEVA RUTINA
                    </button>
                </div>
            );
        }

        function AuthView() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isLogin) await auth.signInWithEmailAndPassword(email.trim(), password);
                    else await auth.createUserWithEmailAndPassword(email.trim(), password);
                } catch (err) { alert(err.message); }
            };
            return (
                <div className="h-screen flex flex-col justify-center p-10 bg-slate-950 text-center text-white">
                    <div className="bg-orange-500 w-24 h-24 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-2xl animate-pulse-slow text-3xl font-black italic">fs</div>
                    <h1 className="text-4xl font-black uppercase mb-2 italic tracking-tighter text-white">{APP_TITLE}</h1>
                    <form onSubmit={handleAuth} className="space-y-4 max-w-sm mx-auto w-full text-white text-center text-center">
                        <input type="email" placeholder="EMAIL" className="w-full bg-slate-900 border-2 border-slate-800 p-5 rounded-[1.5rem] outline-none font-bold text-white text-center text-center text-center" value={email} onChange={e => setEmail(e.target.value)} required />
                        <input type="password" placeholder="CLAVE" className="w-full bg-slate-900 border-2 border-slate-800 p-5 rounded-[1.5rem] outline-none font-bold text-white text-center text-center text-center" value={password} onChange={e => setPassword(e.target.value)} required />
                        <button type="submit" className="w-full bg-orange-500 py-6 rounded-full font-black uppercase shadow-xl text-white text-center">ENTRAR</button>
                    </form>
                    <button onClick={() => setIsLogin(!isLogin)} className="mt-8 text-slate-500 text-[10px] font-black uppercase border-b-2 border-orange-500/30 pb-1 mx-auto italic text-center">{isLogin ? 'REGISTRARME' : 'LOGUEARME'}</button>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('workouts'); 
            const [workouts, setWorkouts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [userExercises, setUserExercises] = useState({ piernas: [], brazos: [], tronco: [] });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    setTimeout(() => setLoading(false), 2000);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const pathBase = db.collection('artifacts').doc(globalAppId).collection('users').doc(user.uid);
                const unsubW = pathBase.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsubW();
            }, [user]);

            const onStartTraining = async (w) => {
                setSelectedWorkout(w);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch (e) {}
                setView('exercise_selection');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white p-10 text-center">
                    <div className="animate-pulse-slow text-9xl mb-8">🏋️‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase tracking-tighter mb-4 leading-tight text-center">{APP_TITLE}</h1>
                    <div className="mt-4 flex flex-col items-center gap-3 text-center">
                        <div className="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                        <span className="text-slate-600 font-black text-[10px] tracking-[0.5em] uppercase italic text-center">VERSIÓN {APP_VERSION}</span>
                    </div>
                </div>
            );

            if (!user) return <AuthView />;

            return (
                <div className="h-full w-full flex flex-col bg-slate-950 overflow-hidden text-center text-white">
                    {view !== 'play' && view !== 'exercise_selection' && (
                        <header className="p-6 flex justify-between items-center bg-slate-900 border-b border-white/5 text-white">
                            <div className="text-left text-white text-center">
                                <h1 className="text-lg font-black italic uppercase leading-none tracking-tight text-white">{APP_TITLE}</h1>
                                <p className="text-[9px] font-bold text-slate-500 truncate mt-1 text-white italic text-center">{user.email}</p>
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 overflow-y-auto scrollbar-hide w-full ${view === 'play' || view === 'exercise_selection' ? 'p-0 h-full' : 'p-0 mx-auto'}`}>
                        {view === 'exercise_selection' && <ExerciseSelectionView onSave={(ex) => { setUserExercises(ex); setView('play'); }} />}
                        {view === 'workouts' && <WorkoutsView workouts={workouts} onStart={onStartTraining} onCreate={() => setView('workouts')} onDelete={(id) => db.collection('artifacts').doc(globalAppId).collection('users').doc(user.uid).collection('workouts').doc(id).delete()} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} exercises={userExercises} onExit={() => { 
                            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                            setView('workouts'); 
                        }} onComplete={(name, time) => { db.collection('artifacts').doc(globalAppId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() }); setView('workouts'); }} />}
                    </main>

                    {view !== 'play' && view !== 'exercise_selection' && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/5 p-4 flex justify-around z-50 shadow-2xl text-white text-center text-center">
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[9px] font-black ${view === 'workouts' ? 'text-orange-500' : 'text-slate-500'}`}><span className="text-xl mb-1 text-center text-white text-center">🏋️</span> RUTINAS</button>
                        </nav>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
