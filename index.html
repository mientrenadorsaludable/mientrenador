<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    
    <title>Mi entrenador Fuerte y saludable | App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        :root {
            --bg-main: #020617;
            --accent: #f97316;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root { height: 100%; width: 100%; display: flex; flex-direction: column; }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        :fullscreen { background-color: #020617; }

        .timer-huge {
            font-size: 60vw; 
            line-height: 0.75;
            font-weight: 900;
            letter-spacing: -0.06em;
            color: #000;
            pointer-events: none;
        }
        
        @media (orientation: landscape) {
            .timer-huge { font-size: 75vh; }
        }

        .btn-control {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .btn-control:active { transform: scale(0.85); }

        .chart-container-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDg0nohFAprIYta3Z3IvFGms55PehyxGIM",
            authDomain: "entrenadorpersonal-4e69d.firebaseapp.com",
            projectId: "entrenadorpersonal-4e69d",
            storageBucket: "entrenadorpersonal-4e69d.firebasestorage.app",
            messagingSenderId: "198872357236",
            appId: "1:198872357236:web:c3cd2a7f5caff197847421",
            measurementId: "G-D4X8GVGRXT"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "mientrenador-v3"; 
        const APP_TITLE = "Mi Entrenador Fuerte y Saludable";
        const APP_VERSION = "21.9.0"; 

        const WARMUP_STEPS = [
            'tobillo derecho', 'tobillo izquierdo', 
            'rodillas a la izquierda', 'rodillas a la derecha', 
            'cintura', 'brazo derecho', 'brazo izquierdo', 'cuello'
        ];

        const DEFAULT_PARAMS = {
            calentamiento: { action: 30, change: 5, rounds: 8, cycles: 1, rest: 0 },
            entrenamiento: { action: 30, change: 10, rounds: 9, cycles: 4, rest: 60 },
            estiramientos: { action: 30, change: 5, rounds: 17, cycles: 1, rest: 0 }
        };

        const formatTime = (s) => {
            const m = Math.floor(s / 60);
            const secs = s % 60;
            return `${m}:${secs.toString().padStart(2, '0')}`;
        };

        const formatTotalTimeLong = (totalSeconds) => {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            let parts = [];
            if (hours > 0) parts.push(`${hours}h`);
            if (minutes > 0 || hours > 0) parts.push(`${minutes}m`);
            if (hours === 0 && minutes < 10) parts.push(`${seconds}s`);
            return parts.length > 0 ? parts.join(" ") : "0s";
        };

        const timeToWords = (totalSeconds) => {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            let res = "";
            if (hours > 0) {
                res += `${hours} ${hours === 1 ? 'hora' : 'horas'}`;
                if (minutes > 0) res += ` con ${minutes} ${minutes === 1 ? 'minuto' : 'minutos'}`;
            } else {
                if (minutes > 0) {
                    res += `${minutes} ${minutes === 1 ? 'minuto' : 'minutos'}`;
                    if (seconds > 0) res += ` con ${seconds} ${seconds === 1 ? 'segundo' : 'segundos'}`;
                } else res += `${seconds} ${seconds === 1 ? 'segundo' : 'segundos'}`;
            }
            return res || "cero segundos";
        };

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('workouts'); 
            const [workouts, setWorkouts] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [editingWorkout, setEditingWorkout] = useState(null);

            const speak = (text) => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'es-ES';
                msg.rate = 1.1;
                window.speechSynthesis.speak(msg);
            };

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    setUser(u && !u.isAnonymous ? u : null);
                    setTimeout(() => setLoading(false), 1500);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const path = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                const unsubW = path.collection('workouts').onSnapshot(s => setWorkouts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = path.collection('history').onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubW(); unsubH(); };
            }, [user]);

            const startWorkout = async (w) => {
                setSelectedWorkout(w);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                } catch (err) {}
                setView('play');
            };

            if (loading) return (
                <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-white p-10">
                    <div className="animate-pulse text-9xl mb-6">🏋️‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase tracking-tighter mb-4 leading-tight">{APP_TITLE}</h1>
                    <div className="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            );

            if (!user) return <AuthView appId={appId} db={db} auth={auth} />;

            return (
                <div className="h-full w-full flex flex-col bg-slate-950 text-white overflow-hidden">
                    {view !== 'play' && (
                        <header className="p-6 flex justify-between items-center bg-slate-900 shrink-0 border-b border-white/5">
                            <div onClick={() => setView('workouts')} className="cursor-pointer text-left">
                                <h1 className="text-lg font-black italic uppercase leading-none">{APP_TITLE}</h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <p className="text-[9px] font-bold text-slate-500 truncate max-w-[100px]">{user.email}</p>
                                    <span className="text-[8px] font-black text-orange-500/50 border-l border-white/10 pl-2">V {APP_VERSION}</span>
                                </div>
                            </div>
                            <button onClick={() => auth.signOut()} className="p-2 bg-red-500/10 rounded-xl text-red-500 font-bold active:scale-90">🚪</button>
                        </header>
                    )}

                    <main className="flex-1 relative overflow-hidden flex flex-col">
                        {view === 'workouts' && <WorkoutsView workouts={workouts} setWorkout={startWorkout} appId={appId} db={db} user={user} onEdit={(w) => { setEditingWorkout(w); setView('create'); }} onCreate={() => { setEditingWorkout(null); setView('create'); }} />}
                        {view === 'avance' && <AvanceView history={history} />}
                        {view === 'create' && <CreateView onCancel={() => { setView('workouts'); setEditingWorkout(null); }} user={user} appId={appId} db={db} workoutToEdit={editingWorkout} />}
                        {view === 'play' && <PlayerView workout={selectedWorkout} speak={speak} onExit={() => setView('workouts')} onComplete={(name, time) => {
                            db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('history').add({ workoutName: name, totalTime: time, date: new Date().toISOString() });
                            setView('workouts');
                        }} />}
                    </main>

                    {view !== 'play' && (
                        <nav className="shrink-0 bg-slate-900 border-t border-white/5 p-4 flex justify-around items-center">
                            <button onClick={() => setView('workouts')} className={`flex flex-col items-center text-[9px] font-black ${view === 'workouts' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1">🏋️</span> MIS RUTINAS
                            </button>
                            <button onClick={() => setView('avance')} className={`flex flex-col items-center text-[9px] font-black ${view === 'avance' ? 'text-orange-500' : 'text-slate-500'}`}>
                                <span className="text-xl mb-1">📊</span> AVANCE
                            </button>
                        </nav>
                    )}
                </div>
            );
        }

        function AuthView({ appId, db, auth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email.trim(), password);
                    else await auth.signInWithEmailAndPassword(email.trim(), password);
                } catch (err) { alert("Error: " + err.message); }
            };
            return (
                <div className="h-full w-full flex flex-col items-center bg-slate-950 p-10 pt-20 text-center">
                    <div className="text-7xl mb-6 animate-pulse">🏃‍♂️</div>
                    <h1 className="text-4xl font-black italic uppercase mb-1 tracking-tighter">{APP_TITLE}</h1>
                    <p className="text-[8px] font-black text-slate-600 tracking-[0.3em] mb-8 uppercase text-white">VERSIÓN {APP_VERSION}</p>
                    <form onSubmit={handleAuth} className="space-y-4 w-full max-w-sm">
                        <input type="email" placeholder="EMAIL" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-center text-white" value={email} onChange={e => setEmail(e.target.value)} required />
                        <input type="password" placeholder="CLAVE" className="w-full p-6 bg-slate-900 border border-white/5 rounded-3xl font-bold outline-none focus:border-orange-500 text-center text-white" value={password} onChange={e => setPassword(e.target.value)} required />
                        <button type="submit" className="w-full bg-orange-500 py-6 rounded-full font-black uppercase shadow-xl active:scale-95 italic text-white">ENTRAR</button>
                    </form>
                    <button onClick={() => setIsRegister(!isRegister)} className="mt-8 text-slate-500 text-[10px] font-black uppercase border-b border-orange-500/30 pb-1 italic">{isRegister ? 'Ya tengo cuenta' : 'Crear cuenta nueva'}</button>
                </div>
            );
        }

        function WorkoutsView({ workouts, setWorkout, appId, db, user, onEdit, onCreate }) {
            return (
                <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-32 animate-fade-in scrollbar-hide">
                    {workouts.map(w => (
                        <div key={w.id} className="glass-card p-6 flex justify-between items-center text-left shadow-xl">
                            <div className="flex-1 cursor-pointer truncate pr-2" onClick={() => setWorkout(w)}>
                                <h3 className="font-black uppercase italic truncate text-sm">{w.name}</h3>
                                <span className="text-[10px] font-black text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded-lg">{formatTime(w.totalTime)}</span>
                            </div>
                            <div className="flex gap-2 shrink-0">
                                <button onClick={() => setWorkout(w)} className="bg-white text-black p-4 rounded-xl shadow-xl active:scale-90 text-xl font-black">▶</button>
                                <button onClick={() => onEdit(w)} className="bg-slate-800 text-white p-4 rounded-xl active:scale-90 text-sm">📝</button>
                                <button onClick={() => db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts').doc(w.id).delete()} className="bg-red-500/10 text-red-500 p-4 rounded-xl active:scale-90 text-sm">🗑️</button>
                            </div>
                        </div>
                    ))}
                    <button onClick={onCreate} className="w-full bg-white/5 border border-white/10 py-6 rounded-full font-black uppercase shadow-xl italic active:scale-95 flex items-center justify-center gap-2 mt-4 text-white">
                        <span className="text-xl">➕</span> NUEVA RUTINA
                    </button>
                </div>
            );
        }

        function PlayerView({ workout, speak, onExit, onComplete }) {
            const [status, setStatus] = useState('paused');
            const [idx, setIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [elapsed, setElapsed] = useState(0);
            const [steps, setSteps] = useState([]);
            const savedRef = useRef(false);
            const lastSpokenKey = useRef(""); 
            const wakeLockRef = useRef(null); 

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { if (!wakeLockRef.current) wakeLockRef.current = await navigator.wakeLock.request('screen'); } catch (err) {}
                }
            };

            const releaseWakeLock = async () => {
                if (wakeLockRef.current !== null) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
            };

            useEffect(() => {
                const s = [];
                const ph = workout.phases;
                // ORDEN: Piernas, Brazos, Tronco
                const REGIONS = ['piernas', 'brazos', 'tronco'];
                
                s.push({ label: 'PREPÁRATE', seconds: 15, color: 'bg-yellow-400', phaseId: 'inicio', r: 0, tr: 0, cy: 0, tc: 0 });

                ['calentamiento', 'entrenamiento', 'estiramientos'].forEach((pId) => {
                    const c = ph[pId];
                    const phaseColor = pId === 'calentamiento' ? 'bg-yellow-400' : pId === 'entrenamiento' ? 'bg-emerald-400' : 'bg-blue-400';
                    for(let cy = 1; cy <= c.cycles; cy++) {
                        for(let r = 1; r <= c.rounds; r++) {
                            let label = pId.toUpperCase();
                            if (pId === 'entrenamiento') label = REGIONS[Math.floor((r-1)/3) % 3].toUpperCase();
                            else if (pId === 'calentamiento') label = WARMUP_STEPS[(r-1) % WARMUP_STEPS.length].toUpperCase();
                            
                            s.push({ label, seconds: c.action, color: phaseColor, phaseId: pId, r, tr: c.rounds, cy, tc: c.cycles });
                            if(r < c.rounds) {
                                s.push({ label: 'CAMBIO', seconds: c.change, color: 'bg-yellow-300', phaseId: pId, r, tr: c.rounds, cy, tc: c.cycles });
                            }
                        }
                        if(cy < c.cycles && c.rest > 0) {
                            s.push({ label: 'DESCANSO', seconds: c.rest, color: 'bg-rose-500', phaseId: pId, r: 'R', tr: c.rounds, cy, tc: c.cycles });
                        }
                    }
                });
                setSteps(s);
                if (s.length > 0) setTimeLeft(s[0].seconds);
                return () => releaseWakeLock();
            }, [workout]);

            // --- LÓGICA DE VOZ REFORZADA ---
            useEffect(() => {
                if (status !== 'running') return;
                const current = steps[idx];
                const next = steps[idx + 1];
                const key = `${idx}_${timeLeft}`;
                if (lastSpokenKey.current === key) return;
                lastSpokenKey.current = key;

                // 1. ANUNCIO DE INICIO DE PASO
                if (timeLeft === current.seconds) {
                    if (idx === 0) {
                        speak("Prepárate");
                    } else if (['CAMBIO', 'DESCANSO'].includes(current.label)) {
                        // Solo dice "Cambio" si el cambio es mayor a 5 segundos, 
                        // si es de 5s el anuncio del siguiente ejercicio (abajo) lo reemplazará.
                        if (current.seconds > 5) speak("Cambio");
                    } else {
                        speak("Empieza");
                    }
                }

                // 2. ANTICIPACIÓN (5 SEGUNDOS ANTES DEL FINAL DEL DESCANSO/PREP)
                if (timeLeft === 5 && ['CAMBIO', 'DESCANSO', 'PREPÁRATE'].includes(current.label)) {
                    if (next) {
                        if (next.phaseId === 'calentamiento') {
                            speak(`Vamos a calentar ${next.label.toLowerCase()}`);
                        } else if (next.phaseId === 'entrenamiento') {
                            // Anuncia zona muscular cada 3 rondas
                            if ((next.r - 1) % 3 === 0) {
                                speak(`Vamos a ejercitar ${next.label.toLowerCase()}`);
                            } else {
                                speak("Cambio");
                            }
                        } else {
                            speak("Cambio");
                        }
                    }
                }

                // 3. CONTEO 3, 2, 1
                if (timeLeft <= 3 && timeLeft > 0) speak(timeLeft.toString());

            }, [timeLeft, status, idx, steps]);

            useEffect(() => {
                let timer = null;
                if (status === 'running') {
                    requestWakeLock();
                    timer = setInterval(() => {
                        setElapsed(e => e + 1);
                        if (timeLeft > 0) setTimeLeft(t => t - 1);
                        else {
                            if (idx < steps.length - 1) { 
                                setIdx(i => i + 1); setTimeLeft(steps[idx+1].seconds); 
                                if('vibrate' in navigator) navigator.vibrate(200); 
                            } else {
                                setStatus('finished'); releaseWakeLock();
                                if (!savedRef.current) { onComplete(workout.name, elapsed + 1); savedRef.current = true; speak(`Felicidades, entrenaste ${timeToWords(elapsed + 1)}`); }
                            }
                        }
                    }, 1000);
                } else releaseWakeLock();
                return () => clearInterval(timer);
            }, [status, timeLeft, idx, steps]);

            if (status === 'finished') return (
                <div className="h-full flex flex-col items-center justify-center p-8 bg-slate-950 italic">
                    <div className="text-9xl mb-10 animate-bounce">🏆</div>
                    <h1 className="text-6xl font-black mb-4 uppercase tracking-tighter text-center">¡LOGRADO!</h1>
                    <div className="glass-card p-10 w-full mb-12 shadow-2xl border-orange-500/20 text-center">
                        <p className="text-[10px] font-black opacity-40 uppercase">Total Entrenamiento</p>
                        <p className="text-7xl font-black text-orange-500 leading-none">{formatTime(elapsed)}</p>
                    </div>
                    <button onClick={handleRestart} className="w-full bg-orange-500 text-white py-5 rounded-full font-black active:scale-95 mb-4">VOLVER A EMPEZAR</button>
                    <button onClick={onExit} className="w-full bg-white text-black py-5 rounded-full font-black active:scale-95">FINALIZAR</button>
                </div>
            );

            return (
                <div className={`h-full flex flex-col transition-colors duration-1000 ${steps[idx]?.color || 'bg-slate-950'} select-none`}>
                    <div className="bg-black/10 p-4 pt-8 flex justify-between items-center shrink-0">
                        <div className="text-left"><span className="text-[10px] font-black uppercase text-orange-500">TIEMPO</span><p className="text-xl font-black italic leading-none">{formatTime(elapsed)}</p></div>
                        <h2 className="text-xs font-black uppercase italic truncate max-w-[150px]">{workout.name}</h2>
                        <button onClick={onExit} className="text-white opacity-40 text-xl px-2">✕</button>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center relative">
                        <h2 className="text-[12vw] font-black uppercase italic tracking-tighter text-black mb-1 leading-none">{steps[idx]?.label || 'LISTO'}</h2>
                        <span className="timer-huge tabular-nums">{timeLeft}</span>
                    </div>
                    <div className="bg-slate-950 p-6 flex flex-col items-center shrink-0">
                        <div className="w-full max-w-md grid grid-cols-3 items-center mb-8">
                            <div className="flex flex-col items-center"><span className="text-[18vw] font-black text-sky-400 leading-none">{steps[idx]?.r || 0}</span><span className="text-[8px] font-black uppercase text-slate-500 mt-1">RONDAS RESTANT...</span></div>
                            <div className="flex flex-col items-center gap-2">
                                <button onClick={() => setStatus(s => s === 'running' ? 'paused' : 'running')} className="w-20 h-20 rounded-full border-4 border-yellow-400 flex items-center justify-center bg-transparent active:scale-95 transition-transform">
                                    <div className="text-yellow-400 text-4xl leading-none">{status === 'running' ? '❚❚' : '▶'}</div>
                                </button>
                                <span className="text-[10px] font-black uppercase text-yellow-400/60 tracking-widest">{status === 'running' ? 'PAUSAR' : 'EMPEZAR'}</span>
                            </div>
                            <div className="flex flex-col items-center"><span className="text-[18vw] font-black text-yellow-400 leading-none">{steps[idx]?.cy || 0}</span><span className="text-[8px] font-black uppercase text-slate-500 mt-1">CICLOS RESTANTES</span></div>
                        </div>
                        <div className="w-full flex justify-center gap-6">
                            <button onClick={handleRestart} className="bg-slate-800 p-4 rounded-full text-yellow-400 text-xl active:scale-75 shadow-lg">🔄</button>
                            <button onClick={handleStopManually} className="bg-red-500/20 p-4 rounded-full text-red-500 text-xl active:scale-90 shadow-lg">⏹</button>
                            <button onClick={() => {const sid = steps.findIndex(s=>s.phaseId==='estiramientos'); if(sid!==-1){setIdx(sid); setTimeLeft(steps[sid].seconds); speak("Vamos a estirar");}}} className="bg-blue-500/20 p-4 rounded-full text-blue-400 text-xl active:scale-90 shadow-lg">🧘</button>
                            <button onClick={() => {if(idx < steps.length - 1) {setIdx(idx+1); setTimeLeft(steps[idx+1].seconds);}}} className="bg-slate-800 p-4 rounded-full text-white text-xl active:scale-75 shadow-lg">⏭</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AvanceView({ history }) {
            const chartRef = useRef(null);
            const totalSeconds = history.reduce((acc, h) => acc + (h.totalTime || 0), 0);

            useEffect(() => {
                const ctx = document.getElementById('advanceChart')?.getContext('2d');
                if (!ctx) return;
                const last14Days = [];
                for (let i = 13; i >= 0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i);
                    last14Days.push(d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }));
                }
                const dailyData = {};
                history.forEach(h => {
                    const dateStr = new Date(h.date).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' });
                    dailyData[dateStr] = (dailyData[dateStr] || 0) + (h.totalTime || 0);
                });
                const chartData = last14Days.map(dayLabel => Math.floor((dailyData[dayLabel] || 0) / 60));
                if (chartRef.current) chartRef.current.destroy();
                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: last14Days,
                        datasets: [{ label: 'Minutos', data: chartData, backgroundColor: '#f97316', borderRadius: 8 }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 10 } } },
                            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 }, autoSkip: false } }
                        }
                    }
                });
                return () => chartRef.current?.destroy();
            }, [history]);

            return (
                <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-32 scrollbar-hide">
                    <div className="glass-card p-8 flex flex-col items-center">
                        <span className="text-[10px] font-black uppercase opacity-40 mb-2">TIEMPO TOTAL ENTRENADO</span>
                        <span className="text-4xl font-black text-orange-500 italic leading-none">{formatTotalTimeLong(totalSeconds)}</span>
                    </div>
                    <div className="glass-card p-6">
                        <span className="text-[10px] font-black uppercase opacity-40 mb-4 block text-white">PROGRESO ÚLTIMAS 2 SEMANAS (MIN)</span>
                        <div className="chart-container-scroll"><div style={{ minWidth: '600px', height: '220px' }}><canvas id="advanceChart"></canvas></div></div>
                    </div>
                </div>
            );
        }

        function CreateView({ onCancel, user, appId, db, workoutToEdit }) {
            const [name, setName] = useState(workoutToEdit ? workoutToEdit.name : '');
            const [phases, setPhases] = useState(workoutToEdit ? workoutToEdit.phases : DEFAULT_PARAMS);
            const [saving, setSaving] = useState(false);
            const update = (p, f, v) => setPhases(prev => ({...prev, [p]: {...prev[p], [f]: parseInt(v) || 0}}));

            const save = async () => {
                if (!name.trim() || saving) return;
                setSaving(true);
                try {
                    const path = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('workouts');
                    const data = { name, phases, updatedAt: new Date().toISOString() };
                    if (workoutToEdit && workoutToEdit.id) await path.doc(workoutToEdit.id).update(data);
                    else await path.add({ ...data, createdAt: new Date().toISOString() });
                    onCancel();
                } catch (e) { alert("Error al guardar"); setSaving(false); }
            };

            return (
                <div className="flex-1 flex flex-col h-full bg-slate-950 overflow-hidden">
                    <header className="shrink-0 p-6 flex items-center gap-4 border-b border-white/5">
                        <button onClick={onCancel} className="p-3 bg-slate-900 rounded-2xl active:scale-90 shadow-lg text-white">⬅</button>
                        <h2 className="text-xl font-black uppercase italic flex-1 text-center">{workoutToEdit ? 'EDITAR' : 'NUEVA'} RUTINA</h2>
                    </header>
                    
                    <div className="flex-1 overflow-y-auto scrollbar-hide p-4 space-y-6">
                        <div className="space-y-2">
                            <label className="text-[10px] font-black uppercase text-orange-500 tracking-widest block text-white">Nombre del Plan</label>
                            <input type="text" placeholder="EJ: RUTINA EXCEL" className="w-full p-6 bg-slate-900 border border-white/10 rounded-[2rem] font-black uppercase italic outline-none focus:border-orange-500 shadow-inner text-white" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        {['calentamiento', 'entrenamiento', 'estiramientos'].map((p) => (
                            <div key={p} className="glass-card p-6 italic shadow-xl space-y-6">
                                <span className="font-black uppercase text-xs tracking-widest text-orange-500 border-b border-white/5 block pb-2 mx-auto w-fit text-white">{p}</span>
                                <div className="grid grid-cols-2 gap-4">
                                    <InputField label="ACCIÓN (S)" val={phases[p].action} set={v => update(p, 'action', v)} />
                                    <InputField label="CAMBIO (S)" val={phases[p].change} set={v => update(p, 'change', v)} />
                                    <InputField label="RONDAS" val={phases[p].rounds} set={v => update(p, 'rounds', v)} />
                                    <InputField label="CICLOS" val={phases[p].cycles} set={v => update(p, 'cycles', v)} />
                                </div>
                            </div>
                        ))}
                        <div className="h-40 shrink-0"></div>
                    </div>

                    <div className="shrink-0 p-6 bg-slate-950 border-t border-white/5 shadow-2xl">
                        <button onClick={save} disabled={saving} className="w-full max-w-sm mx-auto bg-white text-black py-6 rounded-full font-black uppercase shadow-xl active:scale-95 disabled:opacity-50 italic text-center">
                            {saving ? 'GUARDANDO...' : 'GUARDAR RUTINA'}
                        </button>
                    </div>
                </div>
            );
        }

        function InputField({ label, val, set }) {
            return (
                <div className="flex flex-col items-center space-y-1.5">
                    <span className="text-[8px] font-bold uppercase opacity-40 leading-none text-white">{label}</span>
                    <input type="number" className="w-full bg-slate-800/40 border border-white/5 p-4 rounded-xl text-center font-black text-lg outline-none focus:border-orange-500 text-white" value={val} onChange={e => set(e.target.value)} />
                </div>
            );
        }

        function AdminView({ onBack, appId, db }) {
            const [users, setUsers] = useState([]);
            useEffect(() => {
                const unsub = db.collection(`artifacts`).doc(appId).collection('public').doc('data').collection('users_metadata').onSnapshot(s => setUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);
            return (
                <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
                    <button onClick={onBack} className="p-4 bg-slate-900 rounded-2xl font-black text-xs border border-white/5 uppercase w-full mb-4">VOLVER AL INICIO</button>
                    {users.map(u => (
                        <div key={u.id} className="glass-card p-6 flex justify-between items-center shadow-sm">
                            <div className="truncate text-left pr-4"><h4 className="font-bold text-[11px] text-white/90 truncate leading-none mb-1">{u.email}</h4><p className="text-[9px] text-slate-500 font-bold italic uppercase">PASS: {u.password}</p></div>
                            <button onClick={async () => { if(confirm("¿Borrar?")) await db.collection(`artifacts`).doc(appId).collection('public').doc('data').collection('users_metadata').doc(u.id).delete(); }} className="bg-red-500/20 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black border border-red-500/30 uppercase">Borrar</button>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
